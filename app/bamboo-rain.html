<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Book of Rates — Bamboo Rain</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12141F;
    font-family:ui-sans-serif,-apple-system,"Avenir Next",Segoe UI,sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #stop{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:30;
    appearance:none;border:0;border-radius:999px;padding:11px 18px 11px 15px;
    display:flex;align-items:center;gap:8px;
    background:rgba(18,20,31,.5);backdrop-filter:blur(6px);
    color:#F2E3C8;font:600 13px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;
    box-shadow:0 0 0 1.5px rgba(242,227,200,.4)}
  #stop i{width:11px;height:11px;background:#E8725A;display:block;border-radius:2px}

  #fps{position:fixed;top:max(14px,calc(env(safe-area-inset-top) + 2px));left:12px;z-index:30;
    font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;
    color:rgba(242,227,200,.78);background:rgba(18,20,31,.5);border-radius:6px;
    padding:5px 8px;white-space:pre;pointer-events:auto;cursor:pointer;user-select:none}
  #fps.off{opacity:0;pointer-events:none}
  #fpsdot{position:fixed;top:max(14px,calc(env(safe-area-inset-top) + 2px));left:12px;z-index:29;
    width:26px;height:26px;border-radius:50%;display:none}
  #fpsdot.on{display:block}

  #reach{position:fixed;inset:0;z-index:25;touch-action:none;user-select:none;
    -webkit-user-select:none;background:transparent}

  /* THE ONE MARK, and it is not an instruction: a ring on the tail of
     the bamboo that breathes until the glass has been pressed, and then
     never again (§1.6b — a prompt that keeps prompting is a mild way of
     requiring). It sits on the tail because that is the end a finger
     would push; the press works anywhere. */
  #ring{position:fixed;left:0;top:0;z-index:26;pointer-events:none;
    width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;
    box-shadow:0 0 0 1.5px rgba(242,227,200,.85), 0 0 18px rgba(242,227,200,.35);
    opacity:calc(var(--invite,0) * 0.85);
    transform:scale(calc(1.12 - var(--invite,0) * 0.30))}
  @media (prefers-reduced-motion: reduce){
    #ring{opacity:calc(var(--asking,0) * 0.5);transform:none}
  }

  .sheet{position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(12,14,22,.9);backdrop-filter:blur(3px);text-align:center;padding:28px;
    overflow-y:auto}
  .sheet.on{display:grid}
  .sheet h2{margin:0 0 10px;font:300 23px/1.3 ui-serif,Georgia,serif;color:#F2E3C8;letter-spacing:.06em}
  .sheet button{appearance:none;border:0;border-radius:999px;padding:13px 22px;margin-top:8px;
    background:#F2E3C8;color:#12141F;font:600 12px/1.3 ui-sans-serif,sans-serif;letter-spacing:.14em;
    display:block;width:100%;max-width:320px}
  .sheet a.link{background:transparent;color:rgba(242,227,200,.6);
    font:400 11px/1.3 ui-sans-serif,sans-serif;letter-spacing:.08em;
    text-decoration:underline;padding:8px;margin-top:14px;display:block;text-align:center}

  #fallback{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:34px;
    text-align:center;background:linear-gradient(#1B1E33 0%,#3D4264 45%,#7F8099 100%)}
  #fallback.on{display:grid}
  #fallback h2{margin:0 0 12px;font:300 24px/1.25 ui-serif,Georgia,serif;color:#F2E3C8;letter-spacing:.05em}
  #fallback p{margin:0 0 10px;font:400 13px/1.65 ui-sans-serif,sans-serif;
    color:rgba(242,227,200,.84);max-width:300px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="stop" aria-label="Stop the session"><i></i>STOP</button>
<div id="fpsdot" aria-hidden="true"></div>
<div id="fps" role="status" title="Tap to hide">—</div>

<div id="reach" aria-label="Press and hold anywhere: the bamboo lifts under the rain and fills. Let go and it tips and pours."></div>
<div id="ring" aria-hidden="true"></div>

<div id="halt" class="sheet"><div>
  <h2>Stopped</h2>
  <button id="resume">RESUME</button>
  <a class="link" href="./#contents">Back to the book</a>
</div></div>

<div id="fallback"><div>
  <h2>Bamboo Rain needs WebGL</h2>
  <p id="fbwhy">This page paints its scene on the graphics card, and this browser could not give it a WebGL context.</p>
  <p><a class="link" href="./#contents" style="color:inherit">Back to the book</a></p>
</div></div>

<script type="module">
/* ============================================================
   BOOK OF RATES — BAMBOO RAIN, the second version
   13 November 2026. Chapter 1 of the book as it is now organised:
   ONE DEGREE OF FREEDOM. All the reader can do is press, anywhere,
   and the only thing they choose is how long.

   The first Bamboo Rain is kept, unlisted, as bamboo-rain-storm.html.
   The design doc had already called it "the weak one" — its breath
   drove the distance of a rain curtain, which eases and never turns,
   seen through a lens that moved — and the author called it one of
   the worst and asked for a redesign from the principles. This is
   that, and each principle is answered below rather than assumed.

   THE EXPERIENCE. A garden in the rain at the end of a storm. A
   length of bamboo on a pivot hangs mouth-down; the rain's trickle
   runs past it. Press and the tail goes down onto its stone, the
   mouth comes up under the trickle, and it fills while you hold —
   breathe in. Let go and its own weight tips it: it pours, a little
   longer than it filled — breathe out — down a chain of stone bowls
   that light as the water reaches them. The model is in
   js/sozu-breath.js and has no picture in it.

   THE PRINCIPLES, ONE AT A TIME.

   What does the breath move, relative to what? (CLAUDE.md, from
   Lantern Current.) The tube TURNS about a pivot on a post in the
   ground, in front of a lens that does not move at all: this page
   has no camera to move — it is one painted frame. The mouth travels
   a tenth of the frame's height in under a fifth of a second, twice
   a breath. The stream is a ninth of the frame tall for the whole
   exhale. The lights run down a third of the frame. All of it past
   stones that hold still.

   The control is the motion. (The author, on the Murmuration: "we
   want the control over the behavior to be intuitive to the motion
   itself.") A press pushes the tail DOWN. Nothing has to be learnt.

   The phase boundary is in the picture. (Design doc 2.4b, where this
   chapter was the one that failed it.) Two turns and a knock.

   They set the rate, not us. (1.7) There is no schedule here, no cue
   word and no protocol sheet: it opens in stillness and waits. The
   boundary that leans them slower is the plumbing — the tube empties
   1.3 times slower than it fills — and the OFFER is in the
   environment: the bowl one past their last reach glimmers. And the
   superstructure: the grove sways on a rhythm that settles a little
   slower than theirs, and leans with every pour.

   The rhythm is an invitation. (1.6b) Never pressed, it rains, and
   the storm clears on the page's own clock at the same moment it
   would have. Nothing is counted, timed, scored or kept.

   Disclosure, not gatekeeping; and nothing that could hurt. (1.6, 2)
   No hold is asked for — held past full it overflows. It caps at
   about five breaths a minute. The lightning is GONE: the first
   version lit the whole frame, and the design doc records that as a
   caution with no home. A storm that is ending needs no flash.

   What the look is for. (4.2b) Reads at a glance: one bright diagonal
   — the bamboo — on a dark ground. Designed values: dark stones,
   mid greens, pale water, one warm light. Few hues, mood in the air:
   indigo rain going to dusk. Depth: hills, mist, two groves, the
   garden, the rain in front. One structure: cool sky from above, one
   lantern, and the bowls' own lights. Original: the garden is
   composed here; rain drawn as fine slanted lines is a manner, not a
   picture.

   §1.6a does not apply: there is no figure, and nothing is submerged.

   SILENT. No AudioContext, no media elements.
   ============================================================ */

import { requireScroll } from './js/scroll.js';
import { leader, superstructure, phaseGap } from './js/lead.js';
import { newSozu, step, offerOf, reachOf, T_FULL, POUR_RATIO, UP, DOWN } from './js/sozu-breath.js';
import { screenQuad, linkReport } from './js/mesh.js';
import { boot, stage, clock, contextGuard, enter, soloReport } from './js/stage.js';
import { invite } from './js/invite.js';
import { wireExits } from './js/bookframe.js';

const CDN = 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';

/** How long the storm takes to clear, seconds. The reader has no hand
 *  in it: design doc §6, "the storm clears on schedule". */
const CLEARS_IN = 180;

const $ = id => document.getElementById(id);
const elFps = $('fps'), elFpsDot = $('fpsdot'), elHalt = $('halt'), elFall = $('fallback');
const elReach = $('reach'), elRing = $('ring');

function fallback(why){
  if(why) $('fbwhy').textContent = why;
  elFall.classList.add('on');
  elReach.style.display = elRing.style.display = 'none';
  elFps.classList.add('off');
}

boot({ cdn:CDN, fallback, start });

/* ============================================================ */
function start(THREE){

const canvas = $('c');
const clamp01 = x => Math.min(1, Math.max(0, x));
const smoothstep = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };

const { renderer, scene, camera, size, resize, onFit } = stage(THREE, {
  canvas, clear: 0x12141F, fov: 50, near: 0.1, far: 10
});

/* ------------------------------------------------------------------
   THE WHOLE PICTURE IS ONE PAINTED FRAME
   ------------------------------------------------------------------
   A side view of a thing turning about a pin is a flat picture, and
   this draws it as one: every shape is a distance to an edge, every
   edge is softened over exactly one pixel, and there is no mesh to
   have a knot in and no lens to stage. Depth is done the way a print
   does it — by overlap, by value, and by mist between the layers.

   Coordinates: y is 0 at the foot of the glass and 1 at the top; x is
   0 on the centre line and measured in the same units, so a portrait
   phone runs about -0.23 to 0.23 and a wider window simply sees more
   garden either side.
   ------------------------------------------------------------------ */
const U = {
  uTime:   { value: 0 },
  uAspect: { value: 1 },
  uPx:     { value: 1 / 812 },
  uAngle:  { value: DOWN },
  uFill:   { value: 0 },
  uFlow:   { value: 0 },
  uOver:   { value: 0 },
  uCatch:  { value: 0 },
  uKnock:  { value: 0 },
  uBowl:   { value: new THREE.Vector4(0, 0, 0, 0) },
  uOffer:  { value: -1 },
  uRain:   { value: 1 },
  uClear:  { value: 0 },
  uSway:   { value: 0 },
  uWake:   { value: 0 }
};
onFit(() => {
  U.uAspect.value = camera.aspect;
  U.uPx.value = 1 / Math.max(1, size.H * renderer.getPixelRatio());
});

scene.add(screenQuad(THREE, {
  uniforms: U,
  fragment:`
    varying vec2 vUv;
    uniform float uTime, uAspect, uPx, uAngle, uFill, uFlow, uOver, uCatch, uKnock;
    uniform float uOffer, uRain, uClear, uSway, uWake;
    uniform vec4 uBowl;

    /* arithmetic hashes only: a sin-hash collapses at mediump, and this
       project has that on record */
    float h12(vec2 p){
      vec3 p3 = fract(vec3(p.xyx) * 0.1031);
      p3 += dot(p3, p3.yzx + 33.33);
      return fract((p3.x + p3.y) * p3.z);
    }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(h12(i), h12(i + vec2(1.0, 0.0)), f.x),
                 mix(h12(i + vec2(0.0, 1.0)), h12(i + vec2(1.0, 1.0)), f.x), f.y);
    }
    float fbm(vec2 p){
      float a = 0.5, s = 0.0;
      for(int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + vec2(17.3, 9.1); a *= 0.5; }
      return s;
    }

    /* inside a shape whose signed distance is d: 1 inside, 0 outside,
       and exactly one pixel of ramp between */
    float inside(float d){ return 1.0 - smoothstep(-uPx, uPx, d); }
    float sdBox(vec2 p, vec2 b, float r){
      vec2 q = abs(p) - b + r;
      return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
    }
    float sdEll(vec2 p, vec2 r){ return (length(p / r) - 1.0) * min(r.x, r.y); }
    float sdSeg(vec2 p, vec2 a, vec2 b){
      vec2 pa = p - a, ba = b - a;
      return length(pa - ba * clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0));
    }

    /* a grove: one stalk to a column, leaning a little, bending more
       the higher it goes, with a ring at every joint. Returns how much
       of a stalk is here and how lit that part of it is. */
    vec2 grove(vec2 p, float cell, float seed, float w0, float sway){
      float h = max(p.y - 0.455, 0.0);
      float x = p.x - sway * h * h * 1.6;
      float c = floor(x / cell);
      float m = 0.0, lit = 0.0;
      for(int i = -1; i <= 1; i++){
        float ci = c + float(i);
        float r = h12(vec2(ci, seed));
        float has = step(0.30, h12(vec2(ci + 7.0, seed)));
        float cx = (ci + 0.2 + 0.6 * r) * cell;
        float xx = x - cx - (r - 0.5) * 0.12 * h;
        float w = w0 * (0.7 + 0.6 * h12(vec2(ci, seed + 3.0)));
        float mm = inside(abs(xx) - w) * has;
        float joint = 1.0 - smoothstep(0.0, 0.0022, abs(fract((p.y + r) * 12.0) - 0.5) / 12.0);
        float l = (0.5 - 0.5 * clamp(xx / w, -1.0, 1.0)) * (1.0 - 0.45 * joint);
        lit = mix(lit, l, mm);
        m = max(m, mm);
      }
      return vec2(m * step(0.455, p.y), lit);
    }

    /* fine slanted lines, in the manner of a rain print */
    float rainLines(vec2 p, float scale, float speed, float seed, float slant){
      vec2 q = vec2(p.x + p.y * slant, p.y) * scale;
      float cols = 30.0;
      float col = floor(q.x * cols);
      float r = h12(vec2(col, seed));
      float y = q.y * 2.2 + uTime * speed * (0.75 + 0.5 * r) + r * 10.0;
      float seg = fract(y);
      float on = step(1.0 - 0.60 * uRain, h12(vec2(col, floor(y) + seed)));
      float thin = 1.0 - smoothstep(0.0, 0.10, abs(fract(q.x * cols) - 0.5));
      return thin * smoothstep(0.0, 0.12, seg) * (1.0 - smoothstep(0.35, 0.80, seg)) * on;
    }

    /* a stone bowl with water in it; returns the colour laid over col */
    vec3 bowl(vec3 col, vec2 p, vec2 c, float lit, float offered, vec3 skyRef){
      vec2 d = p - c;
      float body = inside(sdEll(d + vec2(0.0, 0.008), vec2(0.044, 0.024)));
      vec3 stone = vec3(0.27, 0.29, 0.34) * (0.55 + 0.75 * smoothstep(-0.03, 0.03, -d.x * 0.5 + d.y));
      col = mix(col, stone, body);
      float water = inside(sdEll(d, vec2(0.033, 0.0095)));
      /* the ring a drop makes, running out across it while it is lit */
      float rr = length(d / vec2(0.033, 0.0095));
      float ring = 0.5 + 0.5 * sin(rr * 9.0 - uTime * 5.0);
      vec3 wcol = mix(skyRef * 0.85, vec3(1.0, 0.80, 0.50), lit * (0.55 + 0.35 * ring));
      col = mix(col, wcol, water);
      /* its light: a small warm float on the water, and what it throws */
      float glow = exp(-dot(d, d) / 0.0016);
      col += vec3(1.0, 0.62, 0.26) * glow * lit * 0.55;
      col = mix(col, vec3(1.0, 0.93, 0.75), inside(length(d - vec2(0.0, 0.004)) - 0.0048) * lit);
      /* THE OFFER: the bowl one past the last reach, barely, breathing */
      float ask = offered * (0.5 + 0.5 * sin(uTime * 1.6));
      col += vec3(1.0, 0.75, 0.45) * exp(-dot(d, d) / 0.0011) * ask * 0.30;
      return col;
    }

    void main(){
      vec2 p = vec2((vUv.x - 0.5) * uAspect, vUv.y);
      float clear = uClear;

      /* ---------------- the sky: storm, going to dusk ---------------- */
      vec3 top = mix(vec3(0.085, 0.095, 0.195), vec3(0.10, 0.15, 0.36), clear);
      vec3 mid = mix(vec3(0.235, 0.255, 0.400), vec3(0.50, 0.37, 0.54), clear);
      vec3 low = mix(vec3(0.500, 0.520, 0.620), vec3(1.00, 0.72, 0.48), clear);
      float sy = smoothstep(0.45, 1.0, p.y);
      vec3 col = mix(low, mid, smoothstep(0.0, 0.45, sy));
      col = mix(col, top, smoothstep(0.35, 1.0, sy));
      float cl = fbm(vec2(p.x * 3.0 + uTime * 0.02, p.y * 5.0));
      col = mix(col, col * 0.70, smoothstep(0.45, 0.80, cl) * (1.0 - 0.75 * clear) * smoothstep(0.58, 0.95, p.y));
      /* and when it has cleared, a moon */
      vec2 mo = p - vec2(0.115, 0.875);
      col = mix(col, vec3(0.98, 0.95, 0.86), inside(length(mo) - 0.017) * clear * clear);
      col += vec3(0.9, 0.85, 0.7) * exp(-dot(mo, mo) / 0.004) * clear * clear * 0.18;

      /* ---------------- far hills, and the mist at their feet ---------------- */
      float r1 = 0.625 + 0.065 * fbm(vec2(p.x * 2.2 + 3.0, 1.0));
      float r2 = 0.565 + 0.055 * fbm(vec2(p.x * 3.1 + 9.0, 4.0));
      col = mix(col, mix(low, mid, 0.60) * 0.95, inside(p.y - r1));
      col = mix(col, mix(mid, vec3(0.13, 0.19, 0.24), 0.55), inside(p.y - r2));
      col = mix(col, low, 0.50 * exp(-pow((p.y - 0.505) / 0.045, 2.0)));

      /* ---------------- the groves ---------------- */
      vec2 g1 = grove(p, 0.034, 3.0, 0.0030, uSway * 0.8);
      col = mix(col, mix(vec3(0.22, 0.31, 0.32), low, 0.40) * (0.80 + 0.35 * g1.y), g1.x * 0.9);
      col = mix(col, low, 0.22 * exp(-pow((p.y - 0.49) / 0.05, 2.0)));
      vec2 g2 = grove(p, 0.072, 11.0, 0.0060, uSway);
      vec3 stalk = mix(vec3(0.085, 0.175, 0.150), vec3(0.46, 0.60, 0.40), g2.y);
      col = mix(col, stalk, g2.x);
      /* leaf, massed at the top of the frame and moving with the stalks */
      float leaf = fbm(vec2((p.x - uSway * 0.05) * 9.0, p.y * 7.0) + vec2(uTime * 0.03, 0.0));
      col = mix(col, vec3(0.065, 0.135, 0.120) * (0.8 + 0.6 * leaf),
                smoothstep(0.54, 0.66, leaf + (p.y - 0.90) * 1.6) * 0.90);

      /* ---------------- the ground ---------------- */
      float ground = inside(p.y - (0.455 + 0.004 * sin(p.x * 11.0)));
      vec3 gcol = mix(vec3(0.085, 0.125, 0.130), mix(vec3(0.26, 0.36, 0.30), low * 0.70, 0.35),
                      smoothstep(0.0, 0.455, p.y));
      gcol *= 0.82 + 0.36 * fbm(p * vec2(34.0, 70.0));
      /* rings where the rain lands, and fewer of them as it eases */
      vec2 rg = p * vec2(9.0, 26.0);
      vec2 rc = floor(rg);
      float rph = fract(uTime * 0.9 + h12(rc) * 7.0);
      float rd = length((fract(rg) - 0.5) * vec2(1.0, 0.55));
      gcol += vec3(0.5, 0.56, 0.66) * (1.0 - smoothstep(0.0, 0.03, abs(rd - rph * 0.30)))
              * (1.0 - rph) * step(1.0 - 0.5 * uRain, h12(rc + 5.0)) * 0.22;
      col = mix(col, gcol, ground);

      /* ---------------- the lantern, and the one warm light ---------------- */
      vec2 L = vec2(-0.172, 0.455);
      float lpost = inside(sdBox(p - vec2(L.x, 0.492), vec2(0.0075, 0.038), 0.002));
      float lbox  = inside(sdBox(p - vec2(L.x, 0.545), vec2(0.023, 0.019), 0.003));
      float lroof = inside(sdBox(p - vec2(L.x, 0.571), vec2(0.036, 0.0065), 0.004));
      float lcap  = inside(sdBox(p - vec2(L.x, 0.582), vec2(0.010, 0.006), 0.004));
      float lbase = inside(sdBox(p - vec2(L.x, 0.458), vec2(0.020, 0.006), 0.003));
      col = mix(col, vec3(0.20, 0.21, 0.26), max(max(lpost, lbase), max(lbox, max(lroof, lcap))));
      float flick = 0.86 + 0.14 * vnoise(vec2(uTime * 2.3, 1.0));
      float warm = (0.55 + 0.45 * clear) * flick;
      col = mix(col, vec3(1.0, 0.80, 0.46), inside(sdBox(p - vec2(L.x, 0.545), vec2(0.013, 0.011), 0.002)) * warm);
      vec2 ld = p - vec2(L.x, 0.545);
      col += vec3(1.0, 0.58, 0.24) * exp(-dot(ld, ld) / 0.010) * warm * 0.30;
      /* and its smear on the wet ground under it */
      col += vec3(1.0, 0.58, 0.24) * exp(-pow((p.x - L.x) / 0.03, 2.0)) * exp(-max(0.455 - p.y, 0.0) / 0.10)
             * ground * warm * 0.14;

      /* ---------------- the feed: a thin pipe, and the trickle off its end ---------------- */
      vec3 bamboo = vec3(0.60, 0.67, 0.40);
      col = mix(col, vec3(0.10, 0.11, 0.13), inside(sdBox(p - vec2(-0.222, 0.560), vec2(0.0045, 0.106), 0.002)));
      float pipe = sdSeg(p, vec2(-0.34, 0.690), vec2(-0.150, 0.664)) - 0.0058;
      col = mix(col, bamboo * (0.60 + 0.5 * smoothstep(-0.006, 0.006, p.y - mix(0.690, 0.664, clamp((p.x + 0.34) / 0.19, 0.0, 1.0)))),
                inside(pipe));

      /* ---------------- the big basin ---------------- */
      vec2 bc = vec2(-0.128, 0.392);
      float bbody = inside(sdEll(p - bc + vec2(0.0, 0.018), vec2(0.090, 0.050)));
      col = mix(col, vec3(0.27, 0.29, 0.34) * (0.50 + 0.85 * smoothstep(-0.06, 0.05, -(p.x - bc.x) * 0.5 + (p.y - bc.y))), bbody);
      vec2 bw = p - vec2(bc.x, 0.404);
      float bwater = inside(sdEll(bw, vec2(0.070, 0.0150)));
      vec3 skyRef = mix(mid, low, 0.55);

      /* ---------------- the tube's geometry (needed by the water too) ---------------- */
      vec2 P = vec2(0.030, 0.585);
      float ca = cos(uAngle), sa = sin(uAngle);
      /* along the tube towards the TAIL, and across it */
      vec2 e = vec2(ca, -sa), n = vec2(sa, ca);
      vec2 q = vec2(dot(p - P, e), dot(p - P, n));
      vec2 M = P - e * 0.172;                      // the mouth
      vec2 Tl = P + e * 0.112;                     // the tail

      /* where the pour lands: thrown a little way out of the mouth */
      float land = M.x - 0.036;
      float wr = length((p - vec2(land, 0.404)) / vec2(0.070, 0.0150));
      float wring = 0.5 + 0.5 * sin(wr * 12.0 - uTime * 7.0);
      vec3 wcol = skyRef * (0.85 + 0.25 * wring * (uFlow * (1.0 - smoothstep(0.0, 1.6, wr)) + 0.25 * uRain));
      wcol += vec3(1.0, 0.70, 0.38) * 0.10 * warm;
      col = mix(col, wcol, bwater);

      /* ---------------- the chain of bowls ---------------- */
      vec2 B0 = vec2(-0.006, 0.336), B1 = vec2(0.086, 0.277), B2 = vec2(0.140, 0.207), B3 = vec2(0.052, 0.150);
      /* the threads of water between them, bright only while it runs */
      float th0 = sdSeg(p, vec2(-0.050, 0.398), B0 + vec2(-0.012, 0.004)) - 0.0016;
      float th1 = sdSeg(p, B0 + vec2(0.030, 0.000), B1 + vec2(-0.012, 0.004)) - 0.0016;
      float th2 = sdSeg(p, B1 + vec2(0.028, 0.000), B2 + vec2(-0.006, 0.006)) - 0.0016;
      float th3 = sdSeg(p, B2 + vec2(-0.026, -0.002), B3 + vec2(0.014, 0.005)) - 0.0016;
      vec3 thread = vec3(0.82, 0.88, 0.96);
      col = mix(col, thread, inside(th0) * uBowl.x * 0.85);
      col = mix(col, thread, inside(th1) * uBowl.y * 0.85);
      col = mix(col, thread, inside(th2) * uBowl.z * 0.85);
      col = mix(col, thread, inside(th3) * uBowl.w * 0.85);
      col = bowl(col, p, B0, uBowl.x, 1.0 - step(0.5, abs(uOffer - 0.0)), skyRef);
      col = bowl(col, p, B1, uBowl.y, 1.0 - step(0.5, abs(uOffer - 1.0)), skyRef);
      col = bowl(col, p, B2, uBowl.z, 1.0 - step(0.5, abs(uOffer - 2.0)), skyRef);
      col = bowl(col, p, B3, uBowl.w, 1.0 - step(0.5, abs(uOffer - 3.0)), skyRef);

      /* ---------------- the stone the tail comes down on ---------------- */
      vec2 ks = p - vec2(0.152, 0.500);
      float rock = inside(sdEll(ks, vec2(0.036 + 0.016 * (1.0 - smoothstep(-0.05, 0.03, ks.y)), 0.066)) + 0.003 * sin(ks.y * 60.0));
      col = mix(col, vec3(0.25, 0.27, 0.32) * (0.45 + 0.95 * smoothstep(-0.05, 0.06, -ks.x * 0.7 + ks.y)), rock);
      /* THE KNOCK: two small arcs off the top of it, for a quarter of a second */
      float kr = length(p - vec2(0.142, 0.572));
      float kn = (1.0 - smoothstep(0.0, 0.0022, abs(kr - (0.016 + 0.030 * (1.0 - uKnock)))))
               * step(0.572, p.y) * uKnock;
      col = mix(col, vec3(0.95, 0.92, 0.82), kn * 0.8);

      /* ---------------- the post and the pin ---------------- */
      col = mix(col, vec3(0.095, 0.100, 0.120), inside(sdBox(p - vec2(P.x, 0.518), vec2(0.0060, 0.068), 0.002)));

      /* ---------------- the trickle: into the mouth when it is up, past it when not ---------------- */
      float fx = -0.150;
      float fEnd = mix(0.405, M.y + 0.004, uCatch);
      float fy = clamp((0.662 - p.y) / max(0.662 - fEnd, 0.001), 0.0, 1.0);
      float feed = inside(abs(p.x - fx - 0.0012 * sin(p.y * 90.0 + uTime * 9.0)) - 0.0016)
                 * step(fEnd, p.y) * step(p.y, 0.662)
                 * (0.55 + 0.45 * vnoise(vec2(3.0, p.y * 60.0 + uTime * 14.0)));
      col = mix(col, vec3(0.84, 0.90, 0.97), feed * 0.80);

      /* ---------------- THE POUR ---------------- */
      float py = clamp((M.y - p.y) / max(M.y - 0.404, 0.001), 0.0, 1.0);
      float sx = M.x - 0.036 * sqrt(py);
      float sw = (0.0018 + 0.0056 * uFlow) * (1.0 - 0.35 * py);
      float stream = inside(abs(p.x - sx) - sw) * step(0.404, p.y) * step(p.y, M.y)
                   * smoothstep(0.0, 0.03, uFlow);
      float streak = 0.70 + 0.30 * vnoise(vec2(p.x * 300.0, p.y * 40.0 + uTime * 16.0));
      col = mix(col, vec3(0.86, 0.92, 0.98) * streak, stream * 0.92);
      /* the overflow of a full tube: a thin second thread down the lip */
      float ov = inside(abs(p.x - (M.x - 0.004)) - 0.0012) * step(0.405, p.y) * step(p.y, M.y - 0.008);
      col = mix(col, vec3(0.84, 0.90, 0.97), ov * uOver * 0.7
                * (0.5 + 0.5 * vnoise(vec2(1.0, p.y * 50.0 + uTime * 12.0))));
      /* where it lands */
      float sp = exp(-pow((p.x - land) / 0.016, 2.0)) * exp(-pow((p.y - 0.410) / 0.010, 2.0));
      col += vec3(0.8, 0.86, 0.95) * sp * uFlow * 0.5;

      /* ---------------- THE BAMBOO ---------------- */
      float tube = sdBox(q - vec2(-0.030, 0.0), vec2(0.142, 0.0115), 0.004);
      float tm = inside(tube);
      float round = clamp(q.y / 0.0115, -1.0, 1.0);
      vec3 tcol = mix(vec3(0.26, 0.34, 0.19), vec3(0.86, 0.90, 0.60), smoothstep(-0.9, 0.9, round));
      tcol *= 1.0 - 0.30 * round * round;
      /* the joints */
      float jd = min(min(abs(q.x + 0.105), abs(q.x + 0.030)), abs(q.x - 0.050));
      tcol *= 1.0 - 0.50 * (1.0 - smoothstep(0.0010, 0.0030, jd));
      /* wet along the top, and the lantern catching its near side */
      tcol += vec3(1.0, 0.62, 0.28) * 0.10 * warm * smoothstep(0.0, 0.14, -q.x);
      col = mix(col, tcol, tm);
      /* the mouth: a dark opening, and the water in it coming up as it fills */
      vec2 mq = q - vec2(-0.170, 0.0);
      float mouth = inside(sdEll(mq, vec2(0.0055, 0.0098)));
      float level = smoothstep(-0.0098, 0.0098, -mq.y + (uFill * 2.0 - 1.0) * 0.0098);
      vec3 mcol = mix(vec3(0.045, 0.06, 0.05), vec3(0.74, 0.84, 0.92), level * step(0.002, uFill));
      col = mix(col, mcol, mouth);
      /* the pin it turns on */
      col = mix(col, vec3(0.08, 0.085, 0.10), inside(length(p - P) - 0.0055));
      col = mix(col, vec3(0.55, 0.56, 0.50), inside(length(p - P) - 0.0022));

      /* ---------------- mist, drifting, thinning as it clears ---------------- */
      float mist = fbm(vec2(p.x * 4.0 - uTime * 0.03, p.y * 9.0));
      col = mix(col, low, 0.16 * mist * (1.0 - 0.7 * clear) * smoothstep(0.42, 0.50, p.y) * (1.0 - smoothstep(0.60, 0.80, p.y)));

      /* ---------------- THE RAIN, in front of everything ---------------- */
      float slant = 0.16 + 0.10 * uSway;
      float rain = 0.24 * rainLines(p, 1.0, 3.2, 1.0, slant) + 0.14 * rainLines(p, 1.8, 2.3, 5.0, slant);
      col = mix(col, vec3(0.80, 0.84, 0.93), rain);

      /* ---------------- the frame ---------------- */
      vec2 vg = (vUv - 0.5) * vec2(1.0, 1.15);
      col *= 1.0 - 0.30 * smoothstep(0.34, 0.85, length(vg));
      /* arriving: it comes up out of the dark */
      col *= 0.25 + 0.75 * uWake;
      col += (h12(gl_FragCoord.xy + fract(uTime) * 61.0) - 0.5) * 0.018;
      gl_FragColor = vec4(col, 1.0);
    }
  `
}));

/* ==================================================================
   THE CONTROL — one press, anywhere
   ================================================================== */
const touches = new Set();
let finger = false, forced = null;
(function(){
  const down = e => { e.preventDefault(); touches.add(e.pointerId); finger = touches.size > 0; };
  const up   = e => { touches.delete(e.pointerId); finger = touches.size > 0; };
  elReach.addEventListener('pointerdown', down);
  elReach.addEventListener('pointerup', up);
  elReach.addEventListener('pointercancel', up);
  elReach.addEventListener('pointerleave', up);
  window.addEventListener('blur', () => { touches.clear(); finger = false; });
  /* and the space bar, for a reader at a keyboard */
  window.addEventListener('keydown', e => { if(e.code === 'Space' && !e.repeat){ e.preventDefault(); touches.add('key'); finger = true; } });
  window.addEventListener('keyup',   e => { if(e.code === 'Space'){ touches.delete('key'); finger = touches.size > 0; } });
})();

const S = newSozu();
const LEAD = leader();
/* nobody leading, the grove takes eleven and a half seconds: the rate
   the full tube would give */
const WORLD = superstructure({ rest: T_FULL * (1 + POUR_RATIO) });
const INVITE = invite({ cycles: 1 });
let t = 0, started = false, wake = 0, lean = 0, pressedOnce = false;

/* ---------- the meter ---------- */
const meter = (function(){
  const buf = [], secs = [];
  let acc = 0, n = 0, lastSec = performance.now(), prev = performance.now(), ran = 0;
  elFps.addEventListener('click', () => { elFps.classList.add('off'); elFpsDot.classList.add('on'); });
  elFpsDot.addEventListener('click', () => { elFps.classList.remove('off'); elFpsDot.classList.remove('on'); });
  return function(now, idle){
    const d = now - prev; prev = now;
    if(!idle && d > 0 && d < 500){ buf.push(d); if(buf.length > 240) buf.shift(); acc += d; n++; ran += d; }
    if(now - lastSec >= 1000){
      const fpsNow = n ? 1000 / (acc / n) : 0;
      secs.push(fpsNow); if(secs.length > 10) secs.shift();
      const sorted = buf.slice().sort((a, b) => a - b), med = sorted.length ? sorted[sorted.length >> 1] : 0;
      const m = Math.floor(ran / 60000), s = Math.floor(ran / 1000) % 60;
      elFps.textContent = idle ? 'paused'
        : fpsNow.toFixed(0) + ' fps   ' + med.toFixed(1) + ' ms\n'
          + 'low ' + Math.min(...secs).toFixed(0) + '   ' + m + ':' + String(s).padStart(2, '0')
          + '\n' + size.W + '×' + size.H + ' @' + renderer.getPixelRatio().toFixed(2);
      acc = 0; n = 0; lastSec = now;
    }
  };
})();

const loop = clock((dt, now, running) => {
  if(!running){ meter(now, true); return; }
  if(started) t += dt;
  U.uTime.value += dt;

  /* --- THE BAMBOO --- */
  const pressed = started && (forced !== null ? forced : finger);
  if(pressed) pressedOnce = true;
  step(S, pressed, dt);

  /* --- THE READER'S RHYTHM, read off the water in the tube, and the
     grove's answer to it: a sway that settles a fraction slower than
     they are going, and a lean with every pour — the breath out moves
     the air. --- */
  if(started){ LEAD.step(dt, S.fill); WORLD.step(dt, LEAD); }
  lean += (S.flow - lean) * (1 - Math.exp(-dt * 2.2));
  U.uSway.value = 0.22 * WORLD.sin + 0.38 * lean;

  /* --- THE STORM, which is nobody's to hurry --- */
  const prog = clamp01(t / CLEARS_IN);
  U.uRain.value = 1 - smoothstep(0.12, 0.92, prog);
  U.uClear.value = smoothstep(0.30, 1.0, prog);
  wake += ((started ? 1 : 0.35) - wake) * (1 - Math.exp(-dt * 1.4));
  U.uWake.value = wake;

  U.uAngle.value = S.angle;
  U.uFill.value = S.fill;
  U.uFlow.value = S.flow;
  U.uOver.value = S.over;
  U.uCatch.value += ((S.catching ? 1 : 0) - U.uCatch.value) * (1 - Math.exp(-dt * 14));
  U.uKnock.value = S.knock;
  U.uBowl.value.set(S.bowl[0], S.bowl[1], S.bowl[2], S.bowl[3]);
  U.uOffer.value = offerOf(S);

  /* --- the ring on the tail, until the glass has been pressed once --- */
  const inv = INVITE.step(dt, { wanted: started, taken: pressedOnce });
  const W = size.W || window.innerWidth || 1, H = size.H || window.innerHeight || 1;
  const tx = 0.030 + Math.cos(S.angle) * 0.112, ty = 0.585 - Math.sin(S.angle) * 0.112;
  elRing.style.left = ((tx / camera.aspect + 0.5) * W).toFixed(1) + 'px';
  elRing.style.top  = ((1 - ty) * H).toFixed(1) + 'px';
  elRing.style.setProperty('--invite', inv.invite.toFixed(3));
  elRing.style.setProperty('--asking', inv.asking ? '1' : '0');

  renderer.render(scene, camera);
  meter(now, false);
});

/* ---------- in and out ---------- */
function begin(){
  started = true; t = 0;
  loop.resync();
}
$('stop').addEventListener('click', () => { loop.running = false; elHalt.classList.add('on'); });
$('resume').addEventListener('click', () => { elHalt.classList.remove('on'); loop.running = true; });

enter(requireScroll, begin);

contextGuard(canvas, {
  onLost(){ loop.stop(); },
  onRestored(){ resize(); loop.resync(); loop.start(); }
});

/* ---------- inspection hook ---------- */
window.__bamboo = {
  scene, camera, THREE,
  begin, pump(dt, n){ return loop.pump(dt, n); },
  /** hold the glass down (true), let it go (false), or give it back to the reader (null) */
  press(v){ forced = (v === null || v === undefined) ? null : !!v; return forced; },
  seek(v){ t = v; },
  now(){
    return {
      t:+t.toFixed(2), started, pressed: S.pressed,
      angle:+S.angle.toFixed(3), fill:+S.fill.toFixed(3), flow:+S.flow.toFixed(3),
      over:+S.over.toFixed(2), pouring:S.pouring, delivered:+S.delivered.toFixed(3),
      bowl:S.bowl.map(b => +b.toFixed(2)), offer: offerOf(S), reach: reachOf(S.lastFill),
      rain:+U.uRain.value.toFixed(3), clear:+U.uClear.value.toFixed(3),
      reader:{ period: LEAD.period === null ? null : +LEAD.period.toFixed(2), measured: LEAD.measured },
      world:{ period:+WORLD.period.toFixed(2), behindDeg:+(phaseGap(LEAD.phase, WORLD.phase) * 360).toFixed(1) },
      sway:+U.uSway.value.toFixed(3)
    };
  },
  links(){ return linkReport(renderer, scene, camera); },
  solo(){ return soloReport(); },
  bench(n){
    const gl = renderer.getContext();
    renderer.render(scene, camera); gl.finish();
    const a = performance.now();
    for(let i = 0; i < n; i++) renderer.render(scene, camera);
    gl.finish();
    return { msPerFrame: (performance.now() - a) / n, n,
             drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  }
};

const exits = wireExits();
/* The loop has to be STARTED: two chapters shipped without this line. */
loop.start();
void exits; void UP;
}
</script>
</body>
