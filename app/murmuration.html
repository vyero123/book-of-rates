<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Book of Rates — The Murmuration (3-D)</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#232B36;
    font-family:ui-sans-serif,-apple-system,"Avenir Next",Segoe UI,sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #stop{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:30;
    appearance:none;border:0;border-radius:999px;padding:11px 18px 11px 15px;
    display:flex;align-items:center;gap:8px;
    background:rgba(35,43,54,.52);backdrop-filter:blur(6px);
    color:#F6E7BC;font:600 13px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;
    box-shadow:0 0 0 1.5px rgba(246,231,188,.42)}
  #stop i{width:11px;height:11px;background:#C86A4A;display:block;border-radius:2px}

  #fps{position:fixed;top:max(14px,calc(env(safe-area-inset-top) + 2px));left:12px;z-index:30;
    font:500 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;
    color:rgba(35,43,54,.62);background:rgba(246,231,188,.42);border-radius:6px;
    padding:5px 8px;white-space:pre;pointer-events:auto;cursor:pointer;user-select:none}
  #fps.off{opacity:0;pointer-events:none}
  #fpsdot{position:fixed;top:max(14px,calc(env(safe-area-inset-top) + 2px));left:12px;z-index:29;
    width:22px;height:22px;border-radius:50%;display:none}
  #fpsdot.on{display:block}

  /* THE CUE, AND NOTHING ELSE OVER THE PICTURE. One word. No protocol
     line, no how-to, no countdown, no progress bar — §2.4b. */
  #cue{position:fixed;left:0;right:0;bottom:max(104px,calc(env(safe-area-inset-bottom) + 96px));
    z-index:20;text-align:center;pointer-events:none;color:#FFF8E4}
  #phase{font:300 25px/1.1 ui-serif,Georgia,serif;letter-spacing:.3em;text-transform:lowercase;
    text-shadow:0 2px 16px rgba(26,32,42,.85)}

  #reach{position:fixed;inset:0;z-index:25;touch-action:none;user-select:none;
    -webkit-user-select:none;background:transparent}
  .mark{position:fixed;left:50%;z-index:26;pointer-events:none;
    width:86px;margin-left:-43px;height:2px;
    background:rgba(255,248,228,.92);
    opacity:calc(var(--invite,0) * 0.9 + var(--held,0) * 0.75);
    transform:translateY(-50%) scaleX(calc(0.55 + var(--invite,0) * 0.45))}
  .mark::after{content:'';position:absolute;left:26px;right:26px;height:1px;
    background:#C86A4A;opacity:var(--after,0)}
  #mUp::after{top:6px}
  #mDn::after{bottom:6px}
  @media (prefers-reduced-motion: reduce){
    .mark{opacity:calc(var(--asking,0) * 0.5 + var(--held,0) * 0.75);transform:translateY(-50%)}
  }

  .sheet{position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(26,32,42,.9);backdrop-filter:blur(3px);text-align:center;padding:28px;
    overflow-y:auto}
  .sheet.on{display:grid}
  .sheet h2{margin:0 0 10px;font:300 23px/1.3 ui-serif,Georgia,serif;color:#F6E7BC;letter-spacing:.06em}
  .sheet button{appearance:none;border:0;border-radius:999px;padding:13px 22px;margin-top:8px;
    background:#F6E7BC;color:#232B36;font:600 12px/1.3 ui-sans-serif,sans-serif;letter-spacing:.14em;
    display:block;width:100%;max-width:320px}
  .sheet button.alt{background:transparent;color:#F6E7BC;
    box-shadow:inset 0 0 0 1.5px rgba(246,231,188,.48);font-weight:500}
  .sheet button.link,.sheet a.link{background:transparent;color:rgba(246,231,188,.58);
    box-shadow:none;font:400 11px/1.3 ui-sans-serif,sans-serif;letter-spacing:.08em;
    text-decoration:underline;padding:8px;margin-top:14px;display:block;text-align:center}
  .sheet a.link{margin-top:4px}
  .sheet p{margin:0 0 14px;font:400 13px/1.6 ui-sans-serif,sans-serif;color:rgba(246,231,188,.8);max-width:320px}

  #fallback{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:34px;
    text-align:center;
    background:linear-gradient(#232B36 0%,#4E5F70 34%,#8C9CA8 62%,#E6D39A 88%,#F6E7BC 100%)}
  #fallback.on{display:grid}
  #fallback h2{margin:0 0 12px;font:300 24px/1.25 ui-serif,Georgia,serif;color:#F6E7BC;letter-spacing:.05em}
  #fallback p{margin:0 0 10px;font:400 13px/1.65 ui-sans-serif,sans-serif;
    color:rgba(246,231,188,.84);max-width:300px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="stop" aria-label="Stop the session"><i></i>STOP</button>
<div id="fpsdot" aria-hidden="true"></div>
<div id="fps" role="status" title="Tap to hide">—</div>

<div id="cue"><div id="phase">breathe in</div></div>

<div id="reach" aria-label="Reach up the glass to gather the flock; let it fall and the flock opens"></div>
<div id="mUp" class="mark" aria-hidden="true"></div>
<div id="mDn" class="mark" aria-hidden="true"></div>

<div id="gate" class="sheet"><div>
  <h2>Watch the flock</h2>
  <button id="gateHolds">BOX BREATHING · 4-4-4-4</button>
  <button id="gateNo" class="alt">NO HOLDS · 4 IN / 5 OUT / 3</button>
</div></div>

<div id="halt" class="sheet"><div>
  <h2>Stopped</h2>
  <button id="resume">RESUME</button>
  <button id="rescreen" class="link">Choose a different pace</button>
  <a class="link" href="./#contents">Back to the book</a>
</div></div>

<div id="fallback"><div>
  <h2>The Murmuration needs WebGL</h2>
  <p id="fbwhy">This page draws a 3-D scene, and this browser could not give it a WebGL context.</p>
  <p><a class="link" href="./#contents" style="color:inherit">Back to the book</a></p>
</div></div>

<script type="module">
/* ============================================================
   BOOK OF RATES — THE MURMURATION
   The chapter that took Lantern Current's slot, and exists to
   answer its diagnosis rather than to fill the gap.

   WHAT THE BREATH DRIVES: `gather`, the SHAPE of the flock.
   Breathe in and it balls up and lifts; breathe out and it opens
   and settles. NOTHING TRAVELS, which is the whole idea — it is
   the one spatial relationship this book does not already have,
   and it is the opposite of the one that failed.

   WHAT MAKES IT LEGIBLE: the birds fly at a constant airspeed, so
   when the ball they are circling halves in radius their ANGULAR
   rate round it doubles. The breath does not move the birds, IT
   TURNS THEM: a gathered flock boils where a spread one drifts.
   The arithmetic, the honest version of it, and the number I got
   wrong before building this are all in js/murmuration-breath.js.

   AND THE LENS DOES NOT MOVE AT ALL. Lantern's rode the thing its
   breath moved and the motion cancelled out; the cheapest way to
   be sure that cannot happen here is a camera that is bolted to
   the ground. It is close and underneath, which is the condition
   every number in the module depends on.

   Nothing is counted, timed, scored or compared. There is no
   failure state: a reader who never touches the glass gets a flock
   that follows the cue a beat behind, drifting its own evening.

   §1.6a is vacuous here: no water. SILENT: no AudioContext, no media.
   ============================================================ */

import { requireScroll } from './js/scroll.js';
import { breath } from './js/breath.js';
import { PROTOCOLS, CHOICE, validChoice, SESSION_CAP,
         CORRIDOR, RANGE, normOf, atOf, rates,
         FLOCK_N, AIRSPEED, SHELL_IN,
         R_H_SPREAD, R_V_SPREAD, R_H_GATHER, R_V_GATHER,
         X_C, ALT_SPREAD, ALT_GATHER,
         radiusAt, radiiAt, altitudeAt, omegaAt, geometry, sweep,
         CAM_AT, CAM_AIM } from './js/murmuration-breath.js';
import { body } from './js/course.js';
import { ramp, fogGlslAA, AA_GLSL, RAMP_AA_GLSL, GRAIN_GLSL, CHIP_GLSL }
  from './js/palette.js';
import { builder, posterMat, screenQuad, linkReport } from './js/mesh.js';
import { boot, stage, clock, contextGuard, fps, choice, enter, soloReport,
         flashMeter } from './js/stage.js';
import { arrival } from './js/arrival.js';
import { invite } from './js/invite.js';
import { wireExits } from './js/bookframe.js';

const ARRIVE = arrival({ dist: 7 });
const CDN = 'https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js';

/* §4.3 — an evening sky, pale and warm low down, cool and deep
   overhead, and the birds in the last two steps of it. Six steps,
   palest first, and every surface picks an index BY HAND. */
const R = ramp([0xF6E7BC, 0xE6D39A, 0xBFC3A4, 0x8C9CA8, 0x4E5F70, 0x232B36]);
const AIR = {
  low:0xF7EAC4, mid:0xDCDCB2, high:0xA9B6B4, zenith:0x6E8292,
  cirrus:0xFFF4D4, warm:0xEFC89A
};
const BIRD = { body:0x232B36, lit:0x4E5F70, far:0x8C9CA8 };

const $ = id => document.getElementById(id);
const elPhase = $('phase');
const elFps = $('fps'), elFpsDot = $('fpsdot');
const elGate = $('gate'), elHalt = $('halt'), elFall = $('fallback');
const elReach = $('reach'), elMUp = $('mUp'), elMDn = $('mDn');

function fallback(why){
  if(why) $('fbwhy').textContent = why;
  elGate.classList.remove('on');
  elFall.classList.add('on');
  $('cue').style.display = 'none';
  elReach.style.display = elMUp.style.display = elMDn.style.display = 'none';
  elFps.classList.add('off');
}

boot({ cdn:CDN, fallback, start });

/* ============================================================ */
function start(THREE){

const canvas = $('c');
const B = breath(PROTOCOLS.box);
const clamp01 = x => Math.min(1, Math.max(0, x));
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const C = h => new THREE.Color(h);
const ramp6 = R.steps.map(C);

const uTime   = { value: 0 };
const uFill   = { value: 0 };
const uRamp   = { value: ramp6 };
const uHaze   = { value: C(AIR.mid) };
/* the three numbers the whole flock is drawn from. TWO RADII, not
   one: the flock is a tall column rather than a ball, because the
   phone is in portrait and a 31 degree frame cannot hold a sphere
   that fills a 62 degree one. See js/murmuration-breath.js. */
const uRH     = { value: R_H_SPREAD };
const uRV     = { value: R_V_SPREAD };
const uCentre = { value: new THREE.Vector3(X_C, ALT_SPREAD, 0) };
/* the orbit ANGLE, accumulated: it is the integral of omega dt and
   omega changes with the radius, so it cannot be recomputed from
   uTime — a shared phase that jumped whenever the flock changed
   shape would tear the whole pattern apart once a breath. */
const uOrbit  = { value: 0 };

const FOG = fogGlslAA({ near: 14, rate: 0.009, steps: 5, max: 0.52 });
const PRE_SKY = AA_GLSL + RAMP_AA_GLSL + GRAIN_GLSL;
const PRE     = AA_GLSL + RAMP_AA_GLSL + FOG + GRAIN_GLSL + CHIP_GLSL;

const { renderer, scene, camera, size, resize, onFit } = stage(THREE, {
  canvas, clear: R.at(5), fov: a => a < 0.75 ? 62 : 52, far: 400
});

/* ------------------------------------------------------------------
   1. THE SKY — and it is the only backdrop there is
   ------------------------------------------------------------------
   The lens looks up at about 72 degrees, so at 375x812 the frame runs
   from roughly 41 to 103 degrees of elevation and THE GROUND IS
   NOWHERE IN IT. That is deliberate — the chapter is the flock, not a
   landscape with a flock in it — but it means the sky has to carry
   which way is up on its own. It does it the way a sky actually does:
   pale and warm towards the horizon, cool and deep towards the
   zenith, in five posterised steps, with a few bands of high cirrus
   low in the frame to give the depth a figure would otherwise give.
   ------------------------------------------------------------------ */
const skyU = {
  uTime, uAspect:{ value: 1 }, uRamp, uFill,
  uLow:{ value:C(AIR.low) }, uMid:{ value:C(AIR.mid) }, uHigh:{ value:C(AIR.high) },
  uZen:{ value:C(AIR.zenith) },
  uCirrus:{ value:C(AIR.cirrus) }, uWarm:{ value:C(AIR.warm) }
};
onFit(() => { skyU.uAspect.value = camera.aspect; });
scene.add(screenQuad(THREE, {
  uniforms: skyU, prelude: PRE_SKY,
  fragment:`
    varying vec2 vUv;
    uniform float uTime, uAspect, uFill;
    uniform vec3 uLow, uMid, uHigh, uZen, uCirrus, uWarm;
    void main(){
      /* vUv.y is up the frame, which here IS elevation: the lens does
         not move, so there is no horizon term to subtract. */
      /* EIGHT STEPS, NOT FOUR, AND BUNCHED LOW. The first version put
         three or four slabs across the whole frame and it read as a
         flag rather than a sky: with no horizon to compress the
         gradient into the bottom of the picture, equal steps are
         equal bands. pow() bunches them where the light is. */
      float h = pow(clamp(vUv.y, 0.0, 1.0), 0.85);
      vec3 col = mix(uLow, uMid, posteriseAA(clamp(h / 0.45, 0.0, 1.0), 3.0));
      col = mix(col, uHigh, posteriseAA(clamp((h - 0.34) / 0.42, 0.0, 1.0), 3.0));
      col = mix(col, uZen,  posteriseAA(clamp((h - 0.74) / 0.26, 0.0, 1.0), 2.0));

      /* a warm wash low and off to one side, so the light has a place
         it comes from without a disc anywhere — the reader called a
         drawn sun a cameo and Long Air lost its for that reason */
      vec2 q = vec2((vUv.x - 0.26) * uAspect, vUv.y - 0.02);
      col = mix(col, uWarm, posteriseAA(1.0 - clamp(length(q) / 0.78, 0.0, 1.0), 3.0) * 0.30);

      /* THIN CIRRUS, LOW, AND MUCH LESS OF IT. The first version was
         broad slow curves and read as sand dunes — a horizon the
         chapter does not have, drawn by accident in the one place the
         reader looks for one. */
      float band = sin(vUv.y * 74.0 + sin(vUv.x * 2.3 + 1.7) * 0.9 + uTime * 0.008);
      float lane = smoothstep(0.02, 0.14, vUv.y) * (1.0 - smoothstep(0.16, 0.34, vUv.y));
      col = mix(col, uCirrus, aastep(0.80, band) * lane * 0.22);

      col += (grainAt(vUv * 540.0) - 0.5) * 0.022;
      gl_FragColor = vec4(col, 1.0);
    }
  `
}));

/* ==================================================================
   2. THE FLOCK — ONE MESH, AND THE BIRDS ARE COMPUTED ON THE GPU
   ==================================================================
   js/mesh.js opens by saying why five hundred objects is five hundred
   draw calls, and the Shepherd paid for that lesson once already at
   58 calls for six animals. Its answer was one merged mesh with a
   uniform ARRAY per figure, which is right for six and impossible for
   560: there is no uniform array that long.

   So this is the same idea taken one step further. Every bird's state
   is DERIVED IN THE VERTEX SHADER from a per-vertex bird index and
   four shared uniforms — the radius, the centre, the orbit angle and
   the time. Nothing about a bird is stored, uploaded or stepped; the
   CPU's entire per-frame contribution to this flock is four numbers.
   One draw call, 1,120 triangles, and the cost of a bird is two
   triangles rather than a matrix.

   AND THERE IS NO CONTROL LOOP ANYWHERE IN IT. Five hundred birds
   converging on a target would be five hundred things proportional to
   a remaining error, which is the shape that cost the Shepherd its
   mapping twice over. A bird's position here is a FUNCTION of
   `gather`, evaluated — it has no state to lag with and no target to
   overshoot.
   ================================================================== */

/** The shape of one bird: a shallow V, two triangles.
 *  `position` is LOCAL and means (along, across, is-a-wingtip), not a
 *  place in the world — the world position is built in the shader. */
const BIRD_SPAN = 0.42;          // metres, wingtip to wingtip
function flockGeometry(){
  const b = builder(THREE, { aBird:1 });
  const V = [
    [ 0.26,  0.00, 0],   // nose
    [-0.05, -0.36, 1],   // left wingtip
    [-0.26,  0.00, 0],   // tail
    [-0.05,  0.36, 1]    // right wingtip
  ];
  for(let i = 0; i < FLOCK_N; i++){
    const base = b.count;
    for(const v of V) b.vertex(v[0] * BIRD_SPAN, v[1] * BIRD_SPAN, v[2], { aBird: i });
    b.tri(base, base + 1, base + 2);
    b.tri(base, base + 2, base + 3);
  }
  return b.geometry();
}

const flockMat = posterMat(THREE, {
  uniforms:{
    uRamp, uTime, uRH, uRV, uCentre, uOrbit, uHaze,
    uBody:{ value:C(BIRD.body) }, uLit:{ value:C(BIRD.lit) },
    uFar:{ value:C(BIRD.far) },
    uShellIn:{ value: SHELL_IN }
  },
  side: THREE.DoubleSide, prelude: PRE,
  vertex:`
    attribute float aBird;
    uniform float uTime, uRH, uRV, uOrbit, uShellIn;
    uniform vec3 uCentre;
    varying float vDist; varying float vEdge; varying float vFace;

    /* four independent numbers from one index. Cheap, deterministic,
       and the same every frame — a bird that re-rolled its own
       identity per frame would be a different bird every frame. */
    float h11(float n){ return fract(sin(n * 127.1) * 43758.5453); }

    void main(){
      float i = aBird;
      float h1 = h11(i + 0.17), h2 = h11(i + 3.71);
      float h3 = h11(i + 9.23), h4 = h11(i + 15.4), h5 = h11(i + 21.9);

      /* EACH BIRD HAS ITS OWN ORBITAL PLANE. The flock is then a shell
         of great circles rather than a swarm of independent wanderers,
         which is what keeps it coherent as a SHAPE while every bird is
         moving fast — and the shape is the thing the breath writes. */
      vec3 n  = normalize(vec3(h1 * 2.0 - 1.0, (h2 * 2.0 - 1.0) * 0.55, h3 * 2.0 - 1.0)
                          + vec3(0.0, 0.0, 0.001));
      vec3 e1 = normalize(cross(n, vec3(0.0, 1.0, 0.17)));
      vec3 e2 = cross(n, e1);

      /* ONE SHARED ORBIT ANGLE, with a per-bird phase and a modest
         per-bird speed spread. Shared, because the angle carries the
         churn — omega = AIRSPEED / radius — and that is a property of
         the FLOCK rather than of a bird. */
      float sp  = 0.74 + 0.52 * h4;
      float ang = h5 * 6.28318 + uOrbit * sp;

      /* the shell has thickness, or the flock is a soap bubble */
      float rr = mix(uShellIn, 1.0, h1 * h4);
      vec3 radial = cos(ang) * e1 + sin(ang) * e2;
      /* THE TWO RADII GO IN HERE, as an anisotropic scale of a unit
         shell: wide is uRH and tall is uRV, so the flock is a column.
         Everything downstream — the heading, the wings — has to be
         scaled the same way or the birds fly across their own flock. */
      vec3 squash = vec3(uRH, uRV, uRH);
      vec3 off = rr * radial * squash;

      /* a slow shared deformation, so the silhouette is a flock and
         not an ellipsoid. It does NOT follow the breath — it is the
         flock's own weather, and keeping it off the breath is what
         stops it reading as something the reader did. */
      float w = sin(uTime * 0.21 + off.x * 0.06) * 0.12
              + sin(uTime * 0.13 - off.y * 0.04) * 0.09;
      off *= 1.0 + w;

      vec3 at = uCentre + off;

      /* the heading is the tangent to its own orbit, squashed the same
         way the position is, or the birds fly across the flock they
         are in */
      vec3 fwd = normalize((-sin(ang) * e1 + cos(ang) * e2) * squash);
      vec3 rgt = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)) + vec3(0.001, 0.0, 0.0));
      vec3 upv = cross(rgt, fwd);

      /* wings. position.z is 1 at a wingtip and 0 at nose and tail,
         so one multiply flaps the bird without a branch. */
      float flap = sin(uTime * 7.4 + h5 * 6.28318) * 0.34;
      vec3 p = at + fwd * position.x + rgt * position.y + upv * (position.z * flap);

      vEdge = h1 * h4;                     // which shell it is on
      vFace = dot(normalize(fwd), normalize(vec3(0.42, 0.30, 0.86)));
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragment:`
    varying float vDist; varying float vEdge; varying float vFace;
    uniform vec3 uBody, uLit, uFar, uHaze;
    void main(){
      /* A BIRD AGAINST A BRIGHT SKY IS A SILHOUETTE, so there is no
         lighting here (§4.2 rule 1) — only the two dark steps of the
         ramp, picked by which way the bird is pointing. A bird turning
         through the light shows its underside for a moment, and two
         values is all that takes. */
      vec3 col = mix(uBody, uLit, aastep(0.34, vFace));
      /* and the far side of the flock goes to haze, which is what
         makes a flat shell read as a volume */
      col = mix(col, uFar, smoothstep(26.0, 56.0, vDist) * 0.55);
      gl_FragColor = vec4(mix(col, uHaze, fogAmount(vDist)), 1.0);
    }
  `
});
const flock = new THREE.Mesh(flockGeometry(), flockMat);
flock.frustumCulled = false;
scene.add(flock);

/* ==================================================================
   3. THE CONTROL — reach up the glass and the flock gathers
   ==================================================================
   The same three-state pursuit the rest of the book uses, and it is
   three-state for the reason the Shepherd's harness proved: a
   protocol with holds has three things a reader can be doing, a
   binary control has two, and the hold phases are then unflyable by
   construction. One touch sets a place, the flock goes to that shape,
   and a hold is leaving your finger where it is.

   THE RATE CAP IS UNTOUCHED. The pursuit computes a direction and
   feeds it through the kit's capped integration, so reaching to the
   top of the glass is worth exactly one inhale's gathering and no
   more. Breathing twice as fast still buys half the shape.
   ================================================================== */
const touches = new Map();
let reachAt = null;
function readTouches(){
  reachAt = touches.size === 1 ? [...touches.values()][0] : null;
}
(function(){
  const el = elReach;
  const put = e => {
    e.preventDefault();
    touches.set(e.pointerId, e.clientY / Math.max(1, window.innerHeight));
    readTouches();
  };
  const drop = e => { touches.delete(e.pointerId); readTouches(); };
  el.addEventListener('pointerdown', put);
  el.addEventListener('pointermove', e => { if(touches.has(e.pointerId)) put(e); });
  el.addEventListener('pointerup', drop);
  el.addEventListener('pointercancel', drop);
  el.addEventListener('pointerleave', drop);
  window.addEventListener('blur', () => { touches.clear(); readTouches(); });
})();

const REACH_TOP = 0.12, REACH_BOT = 0.88;
const reachFill = y => clamp01((REACH_BOT - y) / (REACH_BOT - REACH_TOP));

/* how hard it leans towards your finger, per second */
const PURSUE_K = 14;
/* and how fast it follows the cue when nobody is steering. Not zero —
   that would be a punishment for declining, which §1.6b rules out —
   and not one, which would make the chapter breathe itself. */
const SELF_WALK = 0.42;

let t = 0, started = false;
let RATE = rates(PROTOCOLS.box);
let forceUp = false, forceDown = false;
const gVMax = r => RANGE * r.fillPerSec * 2.2;
let SHAPE = body({ corridor: CORRIDOR, rates: RATE, vMax: gVMax(RATE) });
const REACH_INVITE = invite();
let forceHold = false;

/* THE LENS, IN A MUTABLE OBJECT so it can be moved from the console
   while the scene runs. Staging cannot be measured, only looked at,
   and a push per guess is how an afternoon goes into a camera. The
   module's constants are the source of truth and seed this;
   __murmuration.cam() writes here. */
const CAMV = { x:CAM_AT[0], y:CAM_AT[1], z:CAM_AT[2],
               ax:CAM_AIM[0], ay:CAM_AIM[1], az:CAM_AIM[2] };

const vTmp = new THREE.Vector3();
const fpsTick = fps({ el: elFps, dot: elFpsDot, renderer, size });

const loop = clock((dt, now, running) => {
  if(!running){ fpsTick(now, true); return; }
  if(started) t += dt;

  const st = B.at(t);
  const ph = st.p;
  const sched = B.value(t);

  /* --- THE SHAPE. The schedule says what it should be; the reader's
     finger overrides it; the body spring softens whichever is in
     charge. One integrator, and this is it. --- */
  if(started && !forceHold){
    const schedFill = clamp01(normOf(sched));
    const target = reachAt !== null ? reachFill(reachAt) : schedFill;
    const gap = target - SHAPE.fill;
    const up = gap > 0.012, down = gap < -0.012;
    const pace = reachAt !== null ? 1 : SELF_WALK;
    const cap = (up ? RATE.fillPerSec : down ? RATE.emptyPerSec : 0) * pace * dt;
    if(cap > 0){
      let move = gap * PURSUE_K * dt;
      if(move >  cap) move =  cap;
      if(move < -cap) move = -cap;
      SHAPE.fill = clamp01(SHAPE.fill + move);
    }
    SHAPE.settle(dt);
  } else {
    SHAPE.drive(dt, forceUp, forceDown);
  }
  const gather = SHAPE.value;
  uFill.value = SHAPE.fill;
  uTime.value = t;

  /* --- AND THE FLOCK IS A FUNCTION OF IT. Radius, altitude and the
     churn, all clamped at the point of use because the spring
     overshoots the band on purpose. --- */
  const rr = radiiAt(gather);
  uRH.value = rr.h; uRV.value = rr.v;
  uCentre.value.set(X_C, altitudeAt(gather), 0);
  /* the orbit angle is INTEGRATED, because omega depends on the
     radius and the radius is moving: a shared angle recomputed from
     uTime would jump every time the flock changed shape and tear the
     pattern apart once a breath */
  uOrbit.value += omegaAt(gather) * dt;

  /* --- THE LENS DOES NOT MOVE. Not a tracker, not an ease, not a
     drift: it is bolted to the ground and aimed at a fixed point
     between the two altitudes, so the flock's lift is the flock going
     up the frame. Lantern Current's camera rode the thing its breath
     moved; this one cannot. --- */
  camera.position.set(CAMV.x, CAMV.y, CAMV.z);
  camera.up.set(0, 1, 0);
  camera.lookAt(CAMV.ax, CAMV.ay, CAMV.az);
  ARRIVE.apply(camera, now);

  /* --- the invitation, projected from the flock itself --- */
  const reachWanted = started && ph.k !== 'hold';
  const rInv = REACH_INVITE.step(dt, { wanted: reachWanted, taken: reachAt !== null });
  vTmp.copy(uCentre.value).project(camera);
  const sy = (-vTmp.y * 0.5 + 0.5) * size.H;
  const spread = Math.max(60, size.H * 0.18);
  elMUp.style.top = (sy - spread).toFixed(1) + 'px';
  elMDn.style.top = (sy + spread).toFixed(1) + 'px';
  for(const el of [elMUp, elMDn]){
    el.style.setProperty('--invite', rInv.invite.toFixed(3));
    el.style.setProperty('--held',   rInv.held.toFixed(3));
    el.style.setProperty('--after',  rInv.after.toFixed(3));
    el.style.setProperty('--asking', rInv.asking ? '1' : '0');
  }

  /* --- THE CUE IS ONE WORD (§2.4b). The scene carries the rest, and
     here it carries it loudly: the flock balls up, lifts and starts
     to boil, which is a phase boundary you can see from across the
     room without reading anything. --- */
  const cue = B.cue(t);
  if(cue.label !== elPhase.textContent) elPhase.textContent = cue.label;

  renderer.render(scene, camera);
  fpsTick(now, false);
});

/* ---------- the protocol choice ---------- */
const picked = choice({ key:'bor.murmuration.protocol.v1', valid: validChoice });

function beginWith(which, remember){
  const id = CHOICE[which];
  B.use(PROTOCOLS[id]);
  RATE = rates(PROTOCOLS[id]);
  if(remember) picked.write(which);
  elGate.classList.remove('on');
  started = true;
  SHAPE = body({ corridor: CORRIDOR, rates: RATE, vMax: gVMax(RATE) });
  SHAPE.reset(normOf(B.value(0)));
  uOrbit.value = 0;
  REACH_INVITE.reset();
  touches.clear(); readTouches(); forceHold = false; forceUp = forceDown = false;
  t = 0;
  ARRIVE.start();
  loop.resync();
}
$('gateHolds').addEventListener('click', () => beginWith('holds', true));
$('gateNo').addEventListener('click',    () => beginWith('noholds', true));

$('stop').addEventListener('click', () => { loop.running = false; elHalt.classList.add('on'); });
$('resume').addEventListener('click', () => { elHalt.classList.remove('on'); loop.running = true; });
$('rescreen').addEventListener('click', () => {
  picked.clear();
  elHalt.classList.remove('on');
  elGate.classList.add('on');
  started = false; loop.running = true; t = 0;
});

SHAPE.reset(normOf(B.value(0)));

const ack = picked.read();
enter(requireScroll, () => {
  if(ack) beginWith(ack.choice, false); else elGate.classList.add('on');
});

contextGuard(canvas, {
  onLost(){ loop.stop(); elPhase.textContent = 'paused — the graphics context was lost'; },
  onRestored(){ resize(); loop.resync(); loop.start(); }
});

/* ---------- inspection hook ---------- */
window.__murmuration = {
  begin(which){ beginWith(which === 'noholds' ? 'noholds' : 'holds', false); },
  ack: () => picked.read(),
  scene, camera, THREE,
  pump(dt, n){ return loop.pump(dt, n); },
  reach(y){ if(y === null || y === undefined){ touches.clear(); }
            else { touches.clear(); touches.set(-1, y); }
            readTouches(); forceHold = false;
            return { reachAt, targetFill: reachAt === null ? null : +reachFill(reachAt).toFixed(3) }; },
  hold(which, down){ if(which === 'up') forceUp = !!down; else forceDown = !!down;
                     forceHold = forceUp || forceDown; return { forceUp, forceDown }; },
  seek(v){ t = v; },
  cam(o){ if(o) Object.assign(CAMV, o); return { ...CAMV }; },
  now(){
    const st = B.at(t);
    return { protocol:B.proto.id, cycle:B.cycle, session:B.session, t,
             phase:st.p.k, left:+st.left.toFixed(2),
             schedule:+B.value(t).toFixed(3),
             fill:+SHAPE.fill.toFixed(3), gather:+SHAPE.value.toFixed(3),
             v:+SHAPE.v.toFixed(3),
             error:+(SHAPE.value - B.value(t)).toFixed(3),
             rh:+uRH.value.toFixed(2), rv:+uRV.value.toFixed(2),
             radius:+radiusAt(SHAPE.value).toFixed(2),
             alt:+uCentre.value.y.toFixed(2),
             orbit:+uOrbit.value.toFixed(2),
             reachAt: reachAt === null ? null : +reachAt.toFixed(3),
             touches: touches.size, inviteLearned: REACH_INVITE.learned };
  },
  /** THE CLAIM, MEASURED ON WHAT IS DRAWN rather than predicted.
   *
   *  THE FIRST VERSION OF THIS WAS WRONG IN TWO WAYS and reported a
   *  confident zero, which is the fourth time on this project that a
   *  reported fault has been the instrument. It divided by `size.H`,
   *  which is 0 whenever the page is measured with its pane hidden —
   *  so it is checked here and refused rather than returned. And it
   *  converted NDC y to degrees by multiplying by the field of view,
   *  which is only true for a pinhole at the centre of the frame: NDC
   *  is linear in the TANGENT of the angle, not in the angle.
   *
   *  So the drawn numbers are in PIXELS and as a FRACTION OF THE
   *  FRAME, which need no conversion and are what the reader actually
   *  sees; the angular figures are computed in 3-D from the module,
   *  where they are exact. Both are reported, because the project's
   *  own note says to quote both or neither.
   */
  rates(){
    if(!size.H || !size.W)
      return { error: 'the canvas has no layout (W=' + size.W + ', H=' + size.H +
                      ') — measure this with the page visible' };
    const px = v => { const q = v.clone().project(camera);
      return [(q.x * 0.5 + 0.5) * size.W, (-q.y * 0.5 + 0.5) * size.H]; };
    const out = { frame: { w: size.W, h: size.H, fovDeg: camera.fov,
                           fovHDeg: +(2 * Math.atan(Math.tan(camera.fov / 2 * Math.PI / 180)
                                      * camera.aspect) * 180 / Math.PI).toFixed(1) } };
    for(const [name, g] of [['spread', 0], ['gathered', 1]]){
      const geo = geometry(g), r = radiiAt(g), alt = altitudeAt(g);
      const c = new THREE.Vector3(X_C, alt, 0);
      const L = px(c.clone().setX(X_C - r.h)), Rr = px(c.clone().setX(X_C + r.h));
      const T = px(c.clone().setY(alt + r.v)), Bm = px(c.clone().setY(alt - r.v));
      const wPx = Math.abs(Rr[0] - L[0]), hPx = Math.abs(T[1] - Bm[1]);
      out[name] = {
        /* drawn */
        widthPx: +wPx.toFixed(0), heightPx: +hPx.toFixed(0),
        widthPctFrame: +(wPx / size.W * 100).toFixed(0),
        heightPctFrame: +(hPx / size.H * 100).toFixed(0),
        /* exact, from the module */
        subtendHDeg: +geo.subtendH.toFixed(1), subtendVDeg: +geo.subtendV.toFixed(1),
        bottomRangeM: +geo.bottomRange.toFixed(1),
        birdAtBottomDegPerSec: +geo.birdNear.toFixed(1),
        churnDegPerSec: +geo.churn.toFixed(1)
      };
    }
    out.sweep = sweep(B.proto.phases.find(p => p.k === 'in').d);
    return out;
  },
  /** AND THE SAME THING FLOWN rather than evaluated: pump one inhale
   *  and report how far a tagged bird and the flock's own outline
   *  actually moved on screen, in pixels a second and in percent of
   *  the frame a second. Predicted numbers are a hypothesis; this is
   *  the measurement. */
  flown(){
    if(!size.H) return { error: 'the canvas has no layout' };
    const inhale = B.proto.phases.find(p => p.k === 'in').d;
    const bird = () => {
      /* one bird, reconstructed with the shader's own arithmetic, so
         what is reported is what is drawn rather than a second model
         of it. Bird 0, at the outside of the shell. */
      const h11 = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
      const i = 0;
      const h1 = h11(i + 0.17), h2 = h11(i + 3.71), h3 = h11(i + 9.23),
            h4 = h11(i + 15.4), h5 = h11(i + 21.9);
      const n = new THREE.Vector3(h1*2-1, (h2*2-1)*0.55, h3*2-1).normalize();
      const e1 = new THREE.Vector3().crossVectors(n, new THREE.Vector3(0,1,0.17)).normalize();
      const e2 = new THREE.Vector3().crossVectors(n, e1);
      const ang = h5 * 6.28318 + uOrbit.value * (0.74 + 0.52 * h4);
      const rr = SHELL_IN + (1 - SHELL_IN) * (h1 * h4);
      const off = e1.clone().multiplyScalar(Math.cos(ang))
                   .add(e2.clone().multiplyScalar(Math.sin(ang)))
                   .multiplyScalar(rr)
                   .multiply(new THREE.Vector3(uRH.value, uRV.value, uRH.value));
      const p = uCentre.value.clone().add(off).project(camera);
      return [(p.x*0.5+0.5)*size.W, (-p.y*0.5+0.5)*size.H];
    };
    const bottom = () => { const p = new THREE.Vector3(
      X_C, uCentre.value.y - uRV.value, 0).project(camera);
      return [(p.x*0.5+0.5)*size.W, (-p.y*0.5+0.5)*size.H]; };
    const span = () => { const r = uRH.value, y = uCentre.value.y;
      const a = new THREE.Vector3(X_C - r, y, 0).project(camera);
      const b2 = new THREE.Vector3(X_C + r, y, 0).project(camera);
      return Math.abs(b2.x - a.x) * 0.5 * size.W; };

    /* start from the bottom of a breath, flown exactly on the cue */
    beginWith('holds', false);
    loop.pump(1 / 60, Math.round(60 * (B.proto.phases.reduce((a,p)=>a+p.d,0) - 0.01)));
    let b0 = bird(), e0 = bottom(), s0 = span(), birdMax = 0, edgeMax = 0, prevB = b0, prevE = e0;
    const steps = Math.round(60 * inhale);
    for(let k = 0; k < steps; k++){
      loop.pump(1 / 60, 1);
      const b = bird(), e = bottom();
      birdMax = Math.max(birdMax, Math.hypot(b[0]-prevB[0], b[1]-prevB[1]) * 60);
      edgeMax = Math.max(edgeMax, Math.hypot(e[0]-prevE[0], e[1]-prevE[1]) * 60);
      prevB = b; prevE = e;
    }
    const s1 = span();
    return {
      inhaleSecs: inhale,
      birdPeakPxPerSec: +birdMax.toFixed(0),
      birdPeakPctFramePerSec: +(birdMax / size.H * 100).toFixed(1),
      edgePeakPxPerSec: +edgeMax.toFixed(0),
      edgePeakPctFramePerSec: +(edgeMax / size.H * 100).toFixed(1),
      spanPx: [+s0.toFixed(0), +s1.toFixed(0)],
      spanPctFrameWidth: [+(s0/size.W*100).toFixed(0), +(s1/size.W*100).toFixed(0)],
      shrinkPctFrameWidthPerSec: +(((s0 - s1) / size.W * 100) / inhale).toFixed(1)
    };
  },
  links(){ return linkReport(renderer, scene, camera); },
  solo(){ return soloReport(); },
  probe(){ return flashMeter({ renderer, scene, camera, step: dt => loop.pump(dt, 1) }); },
  bench(n){
    const gl = renderer.getContext();
    renderer.render(scene, camera); gl.finish();
    const a = performance.now();
    for(let i = 0; i < n; i++) renderer.render(scene, camera);
    gl.finish();
    return { msPerRender:(performance.now()-a)/n, n,
             drawCalls: renderer.info.render.calls,
             triangles: renderer.info.render.triangles };
  }
};

const exits = wireExits();
void exits; void SESSION_CAP; void AIRSPEED;
void ALT_SPREAD; void ALT_GATHER; void atOf; void clamp; void resize;
}
</script>
</body>
</html>
