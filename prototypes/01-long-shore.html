<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Book of Rates — Prototype 1: The Long Shore</title>
<style>
  :root{
    --ink:#1E1A2B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0C0716;
    font-family:ui-sans-serif,-apple-system,"Avenir Next",Segoe UI,sans-serif}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%}

  /* ---- always-available stop ---- */
  #stop{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:30;
    appearance:none;border:0;border-radius:999px;padding:11px 18px 11px 15px;
    display:flex;align-items:center;gap:8px;
    background:rgba(12,7,22,.55);backdrop-filter:blur(6px);
    color:#F3EAD7;font:600 13px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;
    box-shadow:0 0 0 1.5px rgba(243,234,215,.35)}
  #stop i{width:11px;height:11px;background:#E8473C;display:block;border-radius:2px}

  #cue{position:fixed;left:0;right:0;bottom:max(58px,calc(env(safe-area-inset-bottom) + 50px));
    z-index:20;text-align:center;pointer-events:none;color:#F6E7C9}
  #phase{font:300 26px/1.1 ui-serif,Georgia,serif;letter-spacing:.3em;text-transform:lowercase;
    text-shadow:0 2px 14px rgba(12,7,22,.6)}
  #sub{margin-top:9px;font:500 10px/1 ui-sans-serif,sans-serif;letter-spacing:.22em;
    opacity:.62;text-transform:uppercase}

  #bar{position:fixed;left:0;right:0;bottom:max(28px,calc(env(safe-area-inset-bottom) + 20px));
    z-index:20;height:2px;margin:0 36px;background:rgba(243,234,215,.18);pointer-events:none}
  #barfill{height:100%;width:0;background:rgba(243,234,215,.75)}

  #note{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));z-index:20;
    text-align:center;font:400 9px/1.4 ui-sans-serif,sans-serif;color:rgba(243,234,215,.4);
    letter-spacing:.06em;padding:0 20px;pointer-events:none}

  /* ---- stopped overlay ---- */
  #halt{position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(8,10,34,.82);backdrop-filter:blur(3px);text-align:center;padding:30px}
  #halt.on{display:grid}
  #halt h2{margin:0 0 10px;font:300 23px/1.3 ui-serif,Georgia,serif;color:#F3EAD7;letter-spacing:.06em}
  #halt p{margin:0 0 26px;font:400 13px/1.6 ui-sans-serif,sans-serif;color:rgba(243,234,215,.72);max-width:280px}
  #halt button{appearance:none;border:0;border-radius:999px;padding:13px 26px;
    background:#F3EAD7;color:#14183F;font:600 12px/1 ui-sans-serif,sans-serif;letter-spacing:.18em}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<button id="stop" aria-label="Stop the session"><i></i>STOP</button>

<div id="cue"><div id="phase">breathe in</div><div id="sub">The land rises</div></div>
<div id="bar"><div id="barfill"></div></div>
<div id="note">Prototype. Sit or lie down. Never practise breathing exercises in or near water, or while driving.</div>

<div id="halt">
  <div>
    <h2>Stopped</h2>
    <p>Let your breathing go back to whatever it wants to do. There is nothing to finish.</p>
    <button id="resume">RESUME</button>
  </div>
</div>

<script>
/* ============================================================
   BOOK OF RATES — Prototype 1: THE LONG SHORE
   A continuous horizontal landscape that IS the breath curve.
   The terrain ahead of the traveller is the next few breaths,
   drawn in space. Nothing pulses; the land simply arrives.
   ============================================================ */

/* ---------- breathing engine (shared across prototypes) ---------- */
const PROTOCOL = {
  label: 'Resonance · 5.5 breaths / min',
  phases: [ {k:'in', d:5.0}, {k:'out', d:6.0} ]   // 11 s cycle = 5.45 bpm
};
const CYCLES = 12;
const CYCLE = PROTOCOL.phases.reduce((a,p)=>a+p.d,0);
const SESSION = CYCLE * CYCLES;

function phaseAt(t){
  let u = t % CYCLE; if(u<0) u += CYCLE;
  for(let i=0;i<PROTOCOL.phases.length;i++){
    const p = PROTOCOL.phases[i];
    if(u < p.d) return {k:p.k, pr:u/p.d, dur:p.d, left:p.d-u};
    u -= p.d;
  }
  const p = PROTOCOL.phases[PROTOCOL.phases.length-1];
  return {k:p.k, pr:1, dur:p.d, left:0};
}
const smooth = x => x*x*(3-2*x);
// 0 = fully exhaled, 1 = fully inhaled. Smooth at the turns so the
// animation never snaps — the turnarounds are where jarring lives.
function level(t){
  const s = phaseAt(t);
  switch(s.k){
    case 'in':  return smooth(s.pr);
    case 'out': return 1 - smooth(s.pr);
    case 'hold':    return 1;
    case 'holdout': return 0;
  }
  return 0;
}

/* ---------- canvas plumbing ---------- */
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W=0, H=0, DPR=1;
function fit(){
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  buildGrain();
}
addEventListener('resize', fit);

/* ---------- paint grain: the Wills texture, cheaply ---------- */
let grain=null;
function buildGrain(){
  const n=140, t=document.createElement('canvas'); t.width=t.height=n;
  const tg=t.getContext('2d'), d=tg.createImageData(n,n);
  for(let i=0;i<n*n;i++){
    const v = 118 + (Math.random()*76|0);
    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v;
    d.data[i*4+3]= 26 + (Math.random()*30|0);
  }
  tg.putImageData(d,0,0);
  grain = g.createPattern(t,'repeat');
}

/* ---------- palette: desert dusk (derived, flat, unstroked) ---------- */
const PAL = {
  skyHi:  ['#4B2355','#E8553A'],   // exhaled -> inhaled
  skyLo:  ['#C9553F','#F6B04A'],
  range3: '#6E2F4E',
  range2: '#52234A',
  range1: '#3A1739',
  near:   '#2A1026',
  nearLo: '#1C0A1C',
  sand:   ['#8E3A46','#C06A43'],
  sandSh: '#4A1A33',
  accent: '#2FA39A',
  figure: '#140A16'
};
const hex = h => [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix(a,b,t){
  const A=hex(a),B=hex(b);
  return `rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`;
}

/* ---------- geometry ---------- */
const V = 44;          // px per second the world travels
const TX = 0.26;       // traveller's screen position, as a fraction of width
const AMP = 0.19;      // dune amplitude, as a fraction of height

let t0 = performance.now()/1000;
let running = true, stoppedAt = 0;

// Terrain height for a screen x at world-time t, in px, relative to the
// traveller's own ground. Because it reads level() at a FUTURE time, the
// slope you can see ahead of you is literally the breath you are about to take.
function groundOffset(x, t, travX, amp){
  const tt = t + (x - travX)/V;
  return (level(tt) - level(t)) * amp;
}

function band(yTop, yBot, fill){
  g.fillStyle = fill; g.fillRect(-2, yTop, W+4, yBot-yTop+2);
}

// A flat, unstroked ridge: sample the breath curve across the screen and
// fill everything beneath it. One path, no outline, hard edge.
function ridge(t, horizon, amp, speedScale, fill, travX, jag){
  g.beginPath();
  g.moveTo(-4, H+4);
  const step = 3;
  for(let x=-4; x<=W+4; x+=step){
    const tt = t + (x - travX)/(V*speedScale);
    let y = horizon - (level(tt) - level(t))*amp;
    if(jag) y += Math.sin(x*0.21 + tt*0.6)*jag + Math.sin(x*0.071)*jag*1.6;
    g.lineTo(x, y);
  }
  g.lineTo(W+4, H+4);
  g.closePath();
  g.fillStyle = fill; g.fill();
}

/* ---------- scenery built as flat shapes ---------- */
// Hard-edged stacked lobes. No gradient inside, no stroke.
function cloud(cx, cy, s, fill){
  g.fillStyle = fill; g.beginPath();
  const lobes=[[-1.5,.15,.55],[-.6,-.25,.78],[.35,-.42,.95],[1.2,-.1,.62],[1.9,.2,.42]];
  for(const [dx,dy,r] of lobes){ g.moveTo(cx+dx*s, cy+dy*s); g.arc(cx+dx*s, cy+dy*s, r*s, 0, 6.2832); }
  g.rect(cx-2.1*s, cy+0.05*s, 4.3*s, 0.42*s);   // flat underside: the key move
  g.fill();
}
// Sheaves of tapering strokes, drawn as triangles so they stay lineless.
function grass(x, y, s, lean, fill){
  g.fillStyle = fill;
  for(let i=0;i<7;i++){
    const o=(i-3)*s*0.16, h=s*(0.65+((i*37)%10)/14), b=s*0.055;
    g.beginPath(); g.moveTo(x+o-b, y); g.lineTo(x+o+b, y);
    g.lineTo(x+o+lean*h*0.5, y-h); g.closePath(); g.fill();
  }
}
// Angular faceting with one hard shadow split — no soft shading anywhere.
function rock(x, y, s, lit, sh){
  g.fillStyle = lit; g.beginPath();
  g.moveTo(x-s, y); g.lineTo(x-s*0.55, y-s*0.82); g.lineTo(x+s*0.1, y-s*1.0);
  g.lineTo(x+s*0.78, y-s*0.5); g.lineTo(x+s, y); g.closePath(); g.fill();
  g.fillStyle = sh; g.beginPath();
  g.moveTo(x+s*0.1, y-s*1.0); g.lineTo(x+s*0.78, y-s*0.5);
  g.lineTo(x+s, y); g.lineTo(x+s*0.12, y); g.closePath(); g.fill();
}
// An original walking figure: silhouette only, strong outline-free shape.
function figure(x, y, s, t){
  const sw = Math.sin(t*2.0), bob = Math.abs(Math.cos(t*2.0))*s*0.05;
  y -= bob;
  g.fillStyle = PAL.figure;
  // legs
  g.beginPath();
  g.moveTo(x-s*0.10,y-s*0.52); g.lineTo(x+s*0.10,y-s*0.52);
  g.lineTo(x+s*0.07+sw*s*0.20, y); g.lineTo(x-s*0.02+sw*s*0.20, y); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(x-s*0.10,y-s*0.52); g.lineTo(x+s*0.10,y-s*0.52);
  g.lineTo(x+s*0.04-sw*s*0.20, y); g.lineTo(x-s*0.05-sw*s*0.20, y); g.closePath(); g.fill();
  // body: a tapered wedge, the whole character of the figure
  g.beginPath();
  g.moveTo(x-s*0.17,y-s*0.50); g.lineTo(x+s*0.17,y-s*0.50);
  g.lineTo(x+s*0.12,y-s*1.00); g.lineTo(x-s*0.12,y-s*1.00); g.closePath(); g.fill();
  // head
  g.beginPath(); g.arc(x, y-s*1.12, s*0.13, 0, 6.2832); g.fill();
  // staff, held still: a vertical anchor against all the horizontals
  g.fillRect(x+s*0.22, y-s*1.30, s*0.028, s*1.30);
}

/* ---------- the frame ---------- */
function draw(now){
  const t = running ? (now/1000 - t0) : stoppedAt;
  const lv = level(t);
  const travX = W*TX, amp = H*AMP;

  // sky: two flat-ish bands, their hue driven by where the breath is.
  // Inhale warms and brightens the whole world; exhale lets it cool.
  const horizon = H*0.52;
  band(0, horizon*0.56, mix(PAL.skyHi[0], PAL.skyHi[1], lv));
  band(horizon*0.56, horizon+2, mix(PAL.skyLo[0], PAL.skyLo[1], lv));

  // sun: sits lower as the breath empties. Still, enormous, flat.
  const sy = horizon - H*0.03 - lv*H*0.075;
  g.fillStyle = `rgba(255,236,181,${0.22+lv*0.5})`;
  g.beginPath(); g.arc(W*0.72, sy, H*0.065, 0, 6.2832); g.fill();

  // clouds: slow parallax, unaffected by the breath, so there is always
  // motion in the frame even at the stillest point of a hold.
  const cw = W*2.6;
  for(let i=0;i<4;i++){
    const cx = ((W*0.3 + i*cw/4) - t*5) % cw; const xx = cx<0?cx+cw:cx;
    cloud(xx - W*0.3, horizon*0.30 + (i%2)*H*0.05, H*0.020+(i%3)*H*0.004,
          `rgba(255,222,186,${0.17+lv*0.1})`);
  }

  // four discrete depth bands, lightening and desaturating with distance.
  // Flat steps, never a continuous gradient.
  ridge(t, horizon+H*0.012, amp*0.16, 7.5, PAL.range3, travX, H*0.014);
  ridge(t, horizon+H*0.055, amp*0.30, 3.4, PAL.range2, travX, H*0.010);
  ridge(t, horizon+H*0.120, amp*0.58, 1.7, PAL.range1, travX, H*0.006);

  // the ground the traveller is actually on
  const nearHz = H*0.78;
  ridge(t, nearHz, amp, 1, mix(PAL.sand[0], PAL.sand[1], lv), travX, 0);

  // hard-edged shadow shape on the lee of each dune: form from value, not line
  g.save();
  g.beginPath();
  g.moveTo(-4,H+4);
  for(let x=-4;x<=W+4;x+=3){
    const tt = t + (x-travX)/V;
    g.lineTo(x, nearHz - (level(tt)-lv)*amp);
  }
  g.lineTo(W+4,H+4); g.closePath(); g.clip();
  g.fillStyle = PAL.sandSh;
  for(let x=-4;x<=W+4;x+=3){
    const tt = t + (x-travX)/V;
    const slope = level(tt+0.12) - level(tt-0.12);
    if(slope < -0.004){                        // downhill = exhaling = in shadow
      const y = nearHz - (level(tt)-lv)*amp;
      g.fillRect(x, y, 4, H);
    }
  }
  g.restore();

  // scenery pinned to world positions, so it drifts past at walking pace
  const spacing = 150;
  const first = Math.floor((t*V - W*0.3)/spacing);
  for(let i=first; i<first+Math.ceil(W/spacing)+3; i++){
    const x = i*spacing - t*V + W*0.3;
    if(x < -70 || x > W+70) continue;
    const tt = t + (x-travX)/V;
    const y = nearHz - (level(tt)-lv)*amp;
    const kind = ((i%7)+7)%7;
    if(kind===0)      rock(x, y+1, H*0.030, PAL.near, PAL.nearLo);
    else if(kind===3) rock(x, y+1, H*0.019, PAL.near, PAL.nearLo);
    else              grass(x, y+1, H*0.034, (lv-0.5)*0.8, PAL.nearLo);
  }

  // foreground band, cropped by the frame edge
  ridge(t, H*0.985, amp*1.22, 0.62, PAL.nearLo, travX, 0);

  figure(travX, nearHz+1, H*0.088, t);

  // grain over everything, then a vignette to hold the eye centre-frame
  if(grain){ g.save(); g.globalAlpha=0.5; g.fillStyle=grain; g.fillRect(0,0,W,H); g.restore(); }
  const vg = g.createRadialGradient(W*0.5,H*0.46,H*0.18, W*0.5,H*0.5,H*0.78);
  vg.addColorStop(0,'rgba(12,7,22,0)'); vg.addColorStop(1,'rgba(12,7,22,0.42)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  // cue text. Deliberately plain: the land is the instruction.
  const s = phaseAt(t);
  const words = {in:'breathe in', out:'breathe out', hold:'hold', holdout:'hold empty'};
  const subs  = {in:'the land rises', out:'the land falls', hold:'the crest', holdout:'the hollow'};
  ph.textContent = words[s.k]; sb.textContent = subs[s.k];
  fill.style.width = Math.min(100, t/SESSION*100) + '%';

  requestAnimationFrame(draw);
}

const ph=document.getElementById('phase'), sb=document.getElementById('sub'),
      fill=document.getElementById('barfill'), halt=document.getElementById('halt');
document.getElementById('stop').onclick = ()=>{
  stoppedAt = performance.now()/1000 - t0; running=false; halt.classList.add('on');
};
document.getElementById('resume').onclick = ()=>{
  t0 = performance.now()/1000 - stoppedAt; running=true; halt.classList.remove('on');
};

fit(); requestAnimationFrame(draw);
</script>
</body>
</html>
