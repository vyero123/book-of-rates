<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Book of Rates — Prototype 3: The Tide</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#1A0F2E;
    font-family:ui-sans-serif,-apple-system,"Avenir Next",Segoe UI,sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  #stop{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:30;
    appearance:none;border:0;border-radius:999px;padding:11px 18px 11px 15px;
    display:flex;align-items:center;gap:8px;
    background:rgba(26,15,46,.5);backdrop-filter:blur(6px);
    color:#FDF1DC;font:600 13px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;
    box-shadow:0 0 0 1.5px rgba(253,241,220,.4)}
  #stop i{width:11px;height:11px;background:#E8473C;display:block;border-radius:2px}

  #cue{position:fixed;left:0;right:0;bottom:max(58px,calc(env(safe-area-inset-bottom) + 50px));
    z-index:20;text-align:center;pointer-events:none;color:#FDF1DC}
  #phase{font:300 26px/1.1 ui-serif,Georgia,serif;letter-spacing:.3em;text-transform:lowercase;
    text-shadow:0 2px 16px rgba(26,15,46,.7)}
  #sub{margin-top:9px;font:500 10px/1 ui-sans-serif,sans-serif;letter-spacing:.22em;
    opacity:.6;text-transform:uppercase}
  #bar{position:fixed;left:0;right:0;bottom:max(28px,calc(env(safe-area-inset-bottom) + 20px));
    z-index:20;height:2px;margin:0 36px;background:rgba(253,241,220,.18);pointer-events:none}
  #barfill{height:100%;width:0;background:rgba(253,241,220,.75)}
  #note{position:fixed;left:0;right:0;bottom:max(8px,env(safe-area-inset-bottom));z-index:20;
    text-align:center;font:400 9px/1.4 ui-sans-serif,sans-serif;color:rgba(253,241,220,.4);
    letter-spacing:.06em;padding:0 20px;pointer-events:none}

  #halt{position:fixed;inset:0;z-index:40;display:none;place-items:center;
    background:rgba(26,15,46,.86);backdrop-filter:blur(3px);text-align:center;padding:30px}
  #halt.on{display:grid}
  #halt h2{margin:0 0 10px;font:300 23px/1.3 ui-serif,Georgia,serif;color:#FDF1DC;letter-spacing:.06em}
  #halt p{margin:0 0 26px;font:400 13px/1.6 ui-sans-serif,sans-serif;color:rgba(253,241,220,.72);max-width:280px}
  #halt button{appearance:none;border:0;border-radius:999px;padding:13px 26px;
    background:#FDF1DC;color:#1A0F2E;font:600 12px/1 ui-sans-serif,sans-serif;letter-spacing:.18em}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="stop" aria-label="Stop the session"><i></i>STOP</button>
<div id="cue"><div id="phase">breathe in</div><div id="sub">the water comes up</div></div>
<div id="bar"><div id="barfill"></div></div>
<div id="note">Prototype. Sit or lie down. Never practise breathing exercises in or near water, or while driving.</div>

<div id="halt"><div>
  <h2>Stopped</h2>
  <p>Let your breathing go back to whatever it wants to do. The tide will keep going without you.</p>
  <button id="resume">RESUME</button>
</div></div>

<script>
/* ============================================================
   BOOK OF RATES — Prototype 3: THE TIDE
   No indicator of any kind. The scene itself breathes: the sea
   climbs the beach on the inhale and withdraws on the exhale,
   the light warms and cools with it, the grass leans. Three
   marker stones give the waterline a readable scale so you
   always know where in the breath you are without a dial.
   ============================================================ */

const PROTOCOL = { label:'Resonance · 5.5 breaths / min',
                   phases:[ {k:'in', d:5.0}, {k:'out', d:6.0} ] };
const CYCLES = 12;
const CYCLE = PROTOCOL.phases.reduce((a,p)=>a+p.d,0);
const SESSION = CYCLE*CYCLES;

function phaseAt(t){
  let u=t%CYCLE; if(u<0)u+=CYCLE;
  for(const p of PROTOCOL.phases){ if(u<p.d) return {k:p.k, pr:u/p.d}; u-=p.d; }
  const p=PROTOCOL.phases[PROTOCOL.phases.length-1]; return {k:p.k, pr:1};
}
const smooth=x=>x*x*(3-2*x);
function level(t){
  const s=phaseAt(t);
  if(s.k==='in')  return smooth(s.pr);
  if(s.k==='out') return 1-smooth(s.pr);
  if(s.k==='hold')return 1;
  return 0;
}

/* ---------- palette: dawn coast (derived) ---------- */
const P = {
  skyA:['#2B1B4E','#5E2B63'],   // exhaled -> inhaled, top band
  skyB:['#8A2B6B','#D4426A'],
  skyC:['#E8473C','#F7A93B'],
  seaFar:['#2A2A5E','#4E4E8E'],
  seaNear:['#1E2350','#3A4A86'],
  foam:['#E3D7E8','#FDF1DC'],
  sandWet:['#7E4A55','#AE6F5E'],
  sandDry:['#8F5A5B','#C98D6A'],
  dune:'#2A1840', dark:'#1A0F2E', deepest:'#0C0716',
  sun:'#FFE9A8'
};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);
  return `rgb(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0})`;};
const pair=(p,t)=>mix(p[0],p[1],t);

const cv=document.getElementById('c'), g=cv.getContext('2d');
let W=0,H=0,DPR=1,grain=null;
function fit(){
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=cv.clientWidth; H=cv.clientHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0); buildGrain();
}
addEventListener('resize',fit);
function buildGrain(){
  const n=140,t=document.createElement('canvas'); t.width=t.height=n;
  const tg=t.getContext('2d'),d=tg.createImageData(n,n);
  for(let i=0;i<n*n;i++){const v=122+(Math.random()*70|0);
    d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=22+(Math.random()*28|0);}
  tg.putImageData(d,0,0); grain=g.createPattern(t,'repeat');
}

function cloud(cx,cy,s,fill){
  g.fillStyle=fill; g.beginPath();
  for(const [dx,dy,r] of [[-1.5,.15,.52],[-.6,-.22,.74],[.35,-.40,.92],[1.2,-.08,.6],[1.9,.18,.4]]){
    g.moveTo(cx+dx*s,cy+dy*s); g.arc(cx+dx*s,cy+dy*s,r*s,0,6.2832);
  }
  g.rect(cx-2.1*s,cy+0.04*s,4.3*s,0.4*s); g.fill();
}
function grass(x,y,s,lean,fill){
  g.fillStyle=fill;
  for(let i=0;i<8;i++){
    const o=(i-4)*s*0.15, hh=s*(0.55+((i*41)%11)/13), b=s*0.045;
    g.beginPath(); g.moveTo(x+o-b,y); g.lineTo(x+o+b,y);
    g.lineTo(x+o+lean*hh*0.55,y-hh); g.closePath(); g.fill();
  }
}
function stone(x,y,s,lit,sh){
  g.fillStyle=lit; g.beginPath();
  g.moveTo(x-s,y); g.lineTo(x-s*0.58,y-s*0.72); g.lineTo(x+s*0.08,y-s*0.92);
  g.lineTo(x+s*0.70,y-s*0.42); g.lineTo(x+s,y); g.closePath(); g.fill();
  g.fillStyle=sh; g.beginPath();
  g.moveTo(x+s*0.08,y-s*0.92); g.lineTo(x+s*0.70,y-s*0.42);
  g.lineTo(x+s,y); g.lineTo(x+s*0.10,y); g.closePath(); g.fill();
}
function bird(x,y,s,ph,fill){
  g.fillStyle=fill; const f=Math.sin(ph)*s*0.5;
  g.beginPath(); g.moveTo(x-s,y-f*0.5); g.lineTo(x,y);
  g.lineTo(x+s,y-f*0.5); g.lineTo(x,y+s*0.17); g.closePath(); g.fill();
}

let t0=performance.now()/1000, running=true, stoppedAt=0;

function draw(now){
  const t = running ? (now/1000-t0) : stoppedAt;
  const lv = level(t);

  const horizon = H*0.34;

  /* --- sky: three flat bands. The whole scene's colour is the breath. --- */
  g.fillStyle=pair(P.skyA,lv); g.fillRect(0,0,W,horizon*0.42);
  g.fillStyle=pair(P.skyB,lv); g.fillRect(0,horizon*0.42,W,horizon*0.33);
  g.fillStyle=pair(P.skyC,lv); g.fillRect(0,horizon*0.75,W,horizon*0.25+2);

  /* --- sun: rises a little on each inhale, sets on each exhale, flat disc --- */
  const sy = horizon - H*0.012 - lv*H*0.055;
  g.fillStyle=P.sun; g.beginPath(); g.arc(W*0.30,sy,H*0.046,0,6.2832); g.fill();

  /* --- clouds and birds: independent of the breath, so the frame is
         never still even at the top of a hold --- */
  const cw=W*2.4;
  for(let i=0;i<4;i++){
    const x=((W*0.2+i*cw/4)-t*6)%cw;
    cloud((x<0?x+cw:x)-W*0.2, horizon*(0.22+(i%2)*0.14), H*0.019+(i%3)*H*0.004,
          `rgba(253,241,220,${0.14+lv*0.09})`);
  }
  for(let i=0;i<3;i++){
    const x=((t*14+i*W*0.42)%(W*1.4))-W*0.2;
    bird(x, horizon*0.36+i*H*0.022, H*0.0085, t*5+i*1.7, 'rgba(26,15,46,0.4)');
  }

  /* --- sea: flat bands, crests always travelling shoreward --- */
  g.fillStyle='#1B1C46';          g.fillRect(0,horizon,W,H*0.014);  // the far line
  g.fillStyle=pair(P.seaFar,lv);  g.fillRect(0,horizon+H*0.014,W,H*0.055);
  g.fillStyle=pair(P.seaNear,lv); g.fillRect(0,horizon+H*0.069,W,H*0.14);

  // The waterline. This is the breath, and it is the only thing that is.
  // yFar = the water's edge at its most distant (fully exhaled).
  // yNear = the edge at its closest, up the beach (fully inhaled).
  // Inhaling brings the sea TOWARDS you, which is DOWN the screen.
  const yFar = horizon+H*0.17, yNear = H*0.80;
  const waterline = yFar + (yNear-yFar)*lv;

  g.fillStyle=pair(P.seaNear,lv);
  g.fillRect(0,yFar,W,waterline-yFar);

  // wave crests: stylised flat bars, scrolling in at a constant pace
  for(let i=0;i<6;i++){
    const prog=((t*0.15+i/6)%1);
    const y=horizon+H*0.05+prog*(waterline-horizon-H*0.05);
    const w=W*(0.22+prog*0.5), x=(((i*137)%100)/100)*(W-w*0.4)-w*0.2;
    g.fillStyle=`rgba(253,241,220,${0.05+prog*0.20})`;
    g.fillRect(x,y,w,Math.max(1.5,H*0.004+prog*H*0.003));
  }

  /* --- the foam edge: a scalloped flat band, the sharpest shape in frame --- */
  g.fillStyle=pair(P.foam,lv);
  g.beginPath(); g.moveTo(-4,waterline);
  for(let x=-4;x<=W+4;x+=6){
    g.lineTo(x, waterline + Math.sin(x*0.05 + t*1.1)*H*0.004
                          + Math.sin(x*0.13 - t*0.7)*H*0.0025);
  }
  g.lineTo(W+4,waterline+H*0.013); g.lineTo(-4,waterline+H*0.013);
  g.closePath(); g.fill();

  /* --- beach: wet sand behind the line, dry in front. The wet band
         shrinking and growing is a second, slower read on the breath. --- */
  g.fillStyle=pair(P.sandWet,lv);
  g.fillRect(0,waterline+H*0.012,W,H-waterline);
  g.fillStyle=pair(P.sandDry,lv);
  g.beginPath(); g.moveTo(-4,H+4);
  for(let x=-4;x<=W+4;x+=8){
    g.lineTo(x, yNear + H*0.025 + Math.sin(x*0.021)*H*0.008);
  }
  g.lineTo(W+4,H+4); g.closePath();
  g.save(); g.beginPath(); g.rect(0,waterline+H*0.012,W,H); g.clip(); g.fill(); g.restore();

  /* --- marker stones: a graduated scale for the waterline, so the
         scene can be read precisely without ever drawing a gauge --- */
  const marks=[[0.16,0.24],[0.55,0.55],[0.85,0.84]];
  for(const [mx,atLevel] of marks){
    const my = yFar + (yNear-yFar)*atLevel;
    // Covered once the tide has climbed past the mark this stone sits at.
    const submerged = lv > atLevel;
    if(submerged){
      // Under water the stone is only a stain and a flat ripple ring —
      // a lit, shadowed stone out in the sea reads as a fin, not a rock.
      g.fillStyle='rgba(16,20,56,0.42)';
      g.beginPath(); g.ellipse(W*mx, my, H*0.024, H*0.009, 0, 0, 6.2832); g.fill();
      g.fillStyle='rgba(253,241,220,0.20)';
      g.beginPath(); g.ellipse(W*mx, my, H*0.030, H*0.012, 0, 0, 6.2832); g.fill();
      g.fillStyle=pair(P.seaNear,lv);
      g.beginPath(); g.ellipse(W*mx, my, H*0.026, H*0.0095, 0, 0, 6.2832); g.fill();
    } else {
      stone(W*mx, my+H*0.004, H*0.022, P.dune, P.deepest);
    }
  }

  /* --- dune and grass in the near foreground, cropped by the frame --- */
  g.fillStyle=P.dune; g.beginPath();
  g.moveTo(-4,H+4); g.lineTo(-4,H*0.90); g.lineTo(W*0.26,H*0.945);
  g.lineTo(W*0.62,H*0.915); g.lineTo(W+4,H*0.965); g.lineTo(W+4,H+4);
  g.closePath(); g.fill();
  const lean=(lv-0.5)*1.4;
  grass(W*0.07,H*0.918,H*0.055,lean,P.deepest);
  grass(W*0.80,H*0.935,H*0.044,lean,P.deepest);

  if(grain){ g.save(); g.globalAlpha=0.46; g.fillStyle=grain; g.fillRect(0,0,W,H); g.restore(); }
  const vg=g.createRadialGradient(W*0.5,H*0.45,H*0.2,W*0.5,H*0.5,H*0.82);
  vg.addColorStop(0,'rgba(26,15,46,0)'); vg.addColorStop(1,'rgba(26,15,46,0.4)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  const s=phaseAt(t);
  const words={in:'breathe in',out:'breathe out',hold:'hold',holdout:'hold empty'};
  const subs ={in:'the water comes up',out:'the water draws back',hold:'high water',holdout:'low water'};
  ph.textContent=words[s.k]; sb.textContent=subs[s.k];
  fill.style.width=Math.min(100,t/SESSION*100)+'%';

  requestAnimationFrame(draw);
}

const ph=document.getElementById('phase'), sb=document.getElementById('sub'),
      fill=document.getElementById('barfill'), halt=document.getElementById('halt');
document.getElementById('stop').onclick=()=>{
  stoppedAt=performance.now()/1000-t0; running=false; halt.classList.add('on'); };
document.getElementById('resume').onclick=()=>{
  t0=performance.now()/1000-stoppedAt; running=true; halt.classList.remove('on'); };

fit(); requestAnimationFrame(draw);
</script>
</body>
</html>
